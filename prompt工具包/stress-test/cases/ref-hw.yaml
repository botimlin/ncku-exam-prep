- id: ref-sdk-pio-count
  tags: [ref, hw, pico-sdk]
  desc: "RP2350 PIO 3 block × 4 SM = 12（RP2040 2×4）"
  turns:
    - card: {file: "pico-sdk.md", title: "RP2350 pico-sdk 3/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
