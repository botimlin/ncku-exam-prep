      value: |2
        5	uint32_t pack(uint8_t hi, uint8_t lo) {
        6	    return ((uint32_t)hi << 8) | lo;
        7	}
        8	uint32_t top_bit(void) {
        9	    return 1 << 31;
        10	}
        11	uint32_t field(uint32_t x) {
        12	    return (x >> 4) & 0xFu;
