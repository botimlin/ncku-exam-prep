- id: ref-host-check-fwrite-crlf
  tags: [ref, hw, host-comm, check-code]
  desc: "查詢 2/2：二進位 frame 用 fwrite 寫 stdout（CRLF 會轉）→ 違反；等 DTR 正確不亂報"
  turns:
    - card: {file: "host-mcu-comm.md", title: "主機↔MCU 2/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 2/2"}
  fills:
    - match: "我的程式"
      value: |2
        10	stdio_init_all();
        11	while (!stdio_usb_connected()) sleep_ms(10);
        12	for (;;) {
        13	    size_t n = build_frame(txbuf, seq++, pl, 32);
        14	    fwrite(txbuf, 1, n, stdout);
        15	    fflush(stdout);
        16	}
  checks:
    - {type: "regex", pattern: "違反[^\\n]*(fwrite)|(fwrite)[^\\n]*違反", name: "violation_flagged"}
    - {type: "not_regex", pattern: "(違反[\\s\\S]*){4,}", name: "few_false_alarms"}
  golden: |
    參考卡上的規則：
    1. stdio_usb_connected() 看 DTR；未連線時輸出直接丟
    2. 不要在 IRQ 中 printf；stdio_init_all() 在 core 0 呼叫
    3. 預設輸出把 \n 變 \r\n，毀二進位；printf / putchar / puts / fwrite 都會轉
    4. stdio_get_until：有 ≥1 byte 就回傳數量
    | # | 結果 OK / 違反 / 看不到 | 程式那一行（帶行號） |
    |---|---|---|
    | 1 | OK | 11 while (!stdio_usb_connected()) sleep_ms(10); |
    | 2 | OK | 10 stdio_init_all(); |
    | 3 | 違反 | 14 fwrite(txbuf, 1, n, stdout); 沒關 CRLF |
    | 4 | 看不到 | 沒有讀取 |
    最該先修的 1 條：stdio_init_all() 之後加 stdio_set_translate_crlf(&stdio_usb, false)，或改用 stdio_put_string(..., false, false)
