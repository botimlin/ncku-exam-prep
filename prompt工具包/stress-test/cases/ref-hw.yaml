- id: ref-sdk-default-board
  tags: [ref, hw, pico-sdk]
  desc: "沒設 PICO_BOARD → 預設 rp2040 + pico，Pico 2 不能跑；-DPICO_BOARD=pico2 並 rm -rf build"
  turns:
    - card: {file: "pico-sdk.md", title: "RP2350 pico-sdk 1/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我的 CMakeLists 只有 include(pico_sdk_import.cmake)、project()、pico_sdk_init()，沒設任何 board。編出來的 uf2 在 Pico 2 上不會跑。為什麼？cmake 要怎麼下？"}
    - {match: "我的情境", value: "之前已經在 build/ 跑過一次 cmake"}
  checks:
    - {type: "contains_any", items: ["PICO_BOARD=pico2"], name: "board_pico2"}
    - {type: "contains_any", items: ["rp2040"], name: "default_rp2040"}
    - {type: "evidence_grounded", min_quotes: 1, max_bad: 1}
    - {type: "not_regex", pattern: "PICO_BOARD=pico2_riscv|PICO_BOARD=rp2350\\b", name: "no_fake_board"}
  golden: |
    證據：「沒設 board/platform → 預設 rp2040 + pico，Pico 2 不能跑」
    答案：沒設時預設編成 rp2040 + pico；改用 cmake .. -DPICO_BOARD=pico2，而且要先 rm -rf build（cache 記住舊值）。
    注意事項：cmake 輸出應有 Target board (PICO_BOARD) is 'pico2'
    不確定的地方：無

