- id: ref-rv-check-int-shift
  tags: [ref, hw, hazard3, check-code]
  desc: "查詢 2/2：1 << 31（int）→ 違反 UB 規則；整數提升與取欄位寫法正確"
  turns:
    - card: {file: "riscv-hazard3.md", title: "RISC-V Hazard3 8/8"}
