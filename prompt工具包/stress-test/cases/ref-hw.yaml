- id: ref-mc-check-isr-blocking
  tags: [ref, hw, multicore, check-code]
  desc: "查詢 2/2：GPIO callback（ISR）內 mutex_enter_blocking → 違反「ISR 不可阻塞，只能 try」"
  turns:
    - card: {file: "multicore-sync.md", title: "多核同步 5/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 2/2"}
  fills:
    - match: "我的程式"
      value: |2
        10	static mutex_t log_lock;
        11	static critical_section_t cs;
        12	void gpio_cb(uint gpio, uint32_t events) {   // GPIO IRQ callback
        13	    mutex_enter_blocking(&log_lock);
        14	    events_seen++;
        15	    mutex_exit(&log_lock);
        16	}
        17	void core1_main(void) {
        18	    critical_section_enter_blocking(&cs);
        19	    shared_x++;
        20	    critical_section_exit(&cs);
        21	}
  checks:
    - {type: "regex", pattern: "違反[^\\n]*(mutex_enter_blocking|13\\s)|(mutex_enter_blocking|13\\s)[^\\n]*違反", name: "violation_flagged"}
    - {type: "not_regex", pattern: "(違反[\\s\\S]*){4,}", name: "few_false_alarms"}
  golden: |
    參考卡上的規則：
    1. critical_section：關本核 IRQ + spinlock；極短；不可重入
    2. mutex：同核再 enter 會 deadlock；ISR 不可阻塞，只能 try
    3. spinlock：只能持有很短；持有時不拿別的 spinlock
    4. save_and_disable_interrupts() 只擋本核
    5. 不要直接寫 sio_hw->spinlock[]
    | # | 結果 OK / 違反 / 看不到 | 程式那一行（帶行號） |
    |---|---|---|
    | 1 | OK | 18–20 critical_section_enter_blocking / exit |
    | 2 | 違反 | 13 mutex_enter_blocking(&log_lock);（在 GPIO callback 內） |
    | 3 | 看不到 | 沒用 spinlock |
    | 4 | 看不到 | 沒關中斷 |
    | 5 | 看不到 | 沒寫 sio_hw |
    最該先修的 1 條：第 13 行改 mutex_try_enter(&log_lock, NULL)，拿不到就跳過


