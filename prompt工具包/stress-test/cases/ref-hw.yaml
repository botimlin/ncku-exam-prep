- id: ref-sdk-usb-early-printf
  tags: [ref, hw, pico-sdk]
  desc: "USB CDC：主機開 port（DTR）前的 printf 被丟 → 等 stdio_usb_connected() 或 sleep_ms(2000)"
  turns:
    - card: {file: "pico-sdk.md", title: "RP2350 pico-sdk 6/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我用 USB stdio，開機一開始 printf 的幾行在電腦上都看不到，之後印的才看得到。為什麼？怎麼修？"}
    - {match: "我的情境", value: "pico_enable_stdio_usb(app 1)，主機用 minicom 開 /dev/ttyACM0"}
  checks:
    - {type: "contains_any", items: ["stdio_usb_connected"], name: "wait_connected"}
    - {type: "regex", pattern: "DTR|丟", name: "dropped"}
    - {type: "evidence_grounded", min_quotes: 1, max_bad: 1}
    - {type: "not_regex", pattern: "答案[：:][^\\n]*(鮑率|baud)", name: "not_baud"}
  golden: |
    證據：「開機到主機開 port 之間的 printf 會消失 → 等 `stdio_usb_connected()` 或開頭 `sleep_ms(2000)`。」
    答案：主機還沒開 port（DTR）之前，USB CDC 的輸出直接被丟掉；開頭加 while (!stdio_usb_connected()) sleep_ms(10);。
    注意事項：主機停止讀取 500 ms 後也會丟
    不確定的地方：無

- id: ref-sdk-clock-then-uart
  tags: [ref, hw, pico-sdk]
  desc: "set_sys_clock_khz 後 clk_peri 改接 48 MHz（PLL_USB）→ 先改時脈再 stdio_init_all/uart_init"
  turns:
    - card: {file: "pico-sdk.md", title: "RP2350 pico-sdk 7/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我先呼叫 stdio_init_all()，再呼叫 set_sys_clock_khz(200000, true)，結果 UART 輸出變亂碼。為什麼？"}
    - {match: "我的情境", value: "printf 走 UART0，115200"}
  checks:
    - {type: "contains_any", items: ["48"], name: "peri_48mhz"}
    - {type: "regex", pattern: "先[^\\n]{0,10}(改|設)[^\\n]{0,6}時脈", name: "clock_first"}
    - {type: "evidence_grounded", min_quotes: 1, max_bad: 1}
    - {type: "not_regex", pattern: "答案[^\\n]*clk_peri[^\\n]{0,10}(跟著|等於|=)\\s*clk_sys", name: "not_follow_sys"}
  golden: |
    證據：「呼叫後 SDK 把 `clk_peri` 改接 48 MHz（PLL_USB）→ **先改時脈，再 `stdio_init_all()` / `uart_init`**，否則鮑率錯。」
    答案：set_sys_clock_khz 之後 clk_peri 被改接 48 MHz，之前用舊時脈算的鮑率就錯了；要先改時脈再 stdio_init_all()。
    注意事項：超過額定 150 MHz 不保證穩定
    不確定的地方：無

