- id: ref-sdk-check-repeating-timer-stack
  tags: [ref, hw, pico-sdk, check-code]
  desc: "查詢 2/2：repeating_timer_t 放在函式區域變數 → 違反「repeating_timer_t 要 static」；時脈順序正確不亂報"
  turns:
    - card: {file: "pico-sdk.md", title: "RP2350 pico-sdk 7/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 2/2"}
  fills:
    - match: "我的程式"
      value: |2
        20	int main(void) {
        21	    set_sys_clock_khz(150000, true);
        22	    stdio_init_all();
        23	    start_sampling();
        24	    while (true) tight_loop_contents();
        25	}
        30	void start_sampling(void) {
        31	    repeating_timer_t timer;
        32	    add_repeating_timer_ms(-10, on_tick, NULL, &timer);
        33	}
  checks:
    - {type: "regex", pattern: "違反[^\\n]*(repeating_timer_t timer|31\\s)|(repeating_timer_t timer|31\\s)[^\\n]*違反", name: "violation_flagged"}
    - {type: "not_regex", pattern: "(違反[\\s\\S]*){4,}", name: "few_false_alarms"}
  golden: |
    參考卡上的規則：
    1. 先改時脈，再 stdio_init_all() / uart_init
    2. sleep_ms/sleep_us：ISR 內不可呼叫
    3. add_repeating_timer_ms：repeating_timer_t 要 static
    4. callback 在 IRQ context：不可 printf/sleep
    5. ISR：先清週邊旗標、要短、共享變數 volatile
    | # | 結果 OK / 違反 / 看不到 | 程式那一行（帶行號） |
    |---|---|---|
    | 1 | OK | 21 set_sys_clock_khz 在 22 stdio_init_all 之前 |
    | 2 | 看不到 | 沒有 ISR |
    | 3 | 違反 | 31 repeating_timer_t timer; |
    | 4 | 看不到 | 沒有 on_tick 內容 |
    | 5 | 看不到 | 沒有 ISR |
    最該先修的 1 條：第 31 行改成 static repeating_timer_t timer;


# ============================================================ pico-dma.md

- id: ref-dma-arg-order
  tags: [ref, hw, dma]
  desc: "dma_channel_configure 第 3 參數 = 目的地 write_addr，第 4 = 來源 read_addr"
  turns:
    - card: {file: "pico-dma.md", title: "RP2350 DMA 1/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "dma_channel_configure 的第 3 個和第 4 個參數，哪個是來源、哪個是目的地？"}
    - {match: "我的情境", value: "要從 src 複製到 dst"}
  checks:
    - {type: "regex", pattern: "第\\s*3[^\\n]{0,20}(目的|dst|write)", name: "third_is_dst"}
    - {type: "evidence_grounded", min_quotes: 1, max_bad: 1}
    - {type: "not_regex", pattern: "第\\s*3\\s*(個)?\\s*(參數)?\\s*[=是：:]?\\s*(來源|src|read)", name: "third_not_src"}
  golden: |
    證據：「`dma_channel_configure(ch, &c, write_addr, read_addr, count, trigger)`：**第 3 參數 = 目的地，第 4 = 來源**（同 memcpy）。」
    答案：第 3 個是目的地 write_addr（dst），第 4 個是來源 read_addr（src），順序同 memcpy。
    注意事項：count 是傳輸筆數不是 bytes
    不確定的地方：無

- id: ref-dma-default-write-incr
  tags: [ref, hw, dma]
  desc: "預設 write increment = false → memcpy 要 channel_config_set_write_increment(&c, true)"
  turns:
    - card: {file: "pico-dma.md", title: "RP2350 DMA 2/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我用 dma_channel_get_default_config 做記憶體複製，結果 dst[0] 等於 src 最後一筆，其他都沒變。預設的 write increment 是 true 還是 false？要怎麼修？"}
    - {match: "我的情境", value: "（無）"}
  checks:
    - {type: "contains_any", items: ["channel_config_set_write_increment"], name: "fix_call"}
    - {type: "regex", pattern: "write[ _]?increment[^\\n]{0,12}false|false", name: "default_false"}
    - {type: "evidence_grounded", min_quotes: 1, max_bad: 1}
    - {type: "not_regex", pattern: "答案[：:][^\\n]{0,30}write[ _]?increment[^\\n]{0,6}(預設)?\\s*(是|為|=)\\s*true", name: "not_default_true"}
  golden: |
    證據：「read increment = **true**；write increment = **false**」
    答案：預設 write increment 是 false，所以每筆都寫到 dst[0]；加 channel_config_set_write_increment(&c, true)。
    注意事項：count 填筆數，不是 bytes
    不確定的地方：無

