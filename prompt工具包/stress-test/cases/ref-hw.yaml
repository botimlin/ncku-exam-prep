    - {type: "regex", pattern: "(?<!\\d)3\\s*(個)?\\s*(PIO\\s*)?(block|個 PIO)|3\\s*×\\s*4|3\\s*x\\s*4", name: "three_pio"}
    - {type: "contains_any", items: ["12"], name: "twelve_sm"}
    - {type: "evidence_grounded", min_quotes: 1, max_bad: 1}
