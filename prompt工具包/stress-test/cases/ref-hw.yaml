- id: ref-dma-check-count-bytes
  tags: [ref, hw, dma, check-code]
  desc: "查詢 2/2：count 填 sizeof(src)（bytes）→ 違反陷阱 1；其他設定正確不亂報"
  turns:
    - card: {file: "pico-dma.md", title: "RP2350 DMA 2/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 2/2"}
  fills:
    - match: "我的程式"
      value: |2
        40	static uint32_t src[256], dst[256];
        41	int ch = dma_claim_unused_channel(true);
        42	dma_channel_config c = dma_channel_get_default_config(ch);
        43	channel_config_set_transfer_data_size(&c, DMA_SIZE_32);
        44	channel_config_set_write_increment(&c, true);
        45	dma_channel_configure(ch, &c, dst, src, sizeof(src), true);
        46	dma_channel_wait_for_finish_blocking(ch);
  checks:
    - {type: "regex", pattern: "違反[^\\n]*(sizeof)|(sizeof)[^\\n]*違反", name: "violation_flagged"}
    - {type: "not_regex", pattern: "(違反[\\s\\S]*){4,}", name: "few_false_alarms"}
  golden: |
    參考卡上的規則：
    1. count 填成 bytes → 搬 2/4 倍。用 count_of(arr)，不要 sizeof(arr)。
    2. 參數順序：dst 在前、src 在後。
    3. 忘開 write_increment → dst[0] = src 最後一筆。
    4. 位址須對齊 data size。
    5. buffer 是區域變數 → 用 static/全域。
    | # | 結果 OK / 違反 / 看不到 | 程式那一行（帶行號） |
    |---|---|---|
    | 1 | 違反 | 45 dma_channel_configure(ch, &c, dst, src, sizeof(src), true); |
    | 2 | OK | 45 dst 在前 |
    | 3 | OK | 44 channel_config_set_write_increment(&c, true); |
    | 4 | OK | 40 uint32_t 陣列 |
    | 5 | OK | 40 static |
    最該先修的 1 條：第 45 行 sizeof(src) 改成 count_of(src)（256 筆）


