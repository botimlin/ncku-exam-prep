      value: |2
        bits.c:21:22: runtime error: shift exponent 32 is too large for 32-bit type 'unsigned int'
        SUMMARY: UndefinedBehaviorSanitizer: undefined-behavior bits.c:21:22 in
    - match: "報告指到"
      value: |2
            18	uint32_t mask_bits(unsigned width)
            19	{
            20	    // width = 1..32
            21	    return (1u << width) - 1u;
            22	}
  checks:
    - {type: choice, option: "位移量太大", field_in_answer: "類型"}
