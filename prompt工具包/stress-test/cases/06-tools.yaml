# 工具卡：gdb（1）、sanitizer（2）、卡住（3）、序列埠 bytes（5）、ROS 2 看不到（6）、最小修改（7）

- id: t1-gdb-oob
  tags: [tools, gdb, choice]
  desc: 迴圈 i <= n 越界 → 原因 B，位置 sum.c:9
  card: {file: "06-tools-debug.md", title: "工具 1/9"}
  fills:
    - {match: "訊號", value: "SIGSEGV"}
    - match: "bt 與 info"
      value: |2
        Program received signal SIGSEGV, Segmentation fault.
        0x0000555555555189 in add_all (buf=0x7fffffffd000, n=1024) at sum.c:9
        9	        s += buf[i];
        #0  0x0000555555555189 in add_all (buf=0x7fffffffd000, n=1024) at sum.c:9
        #1  0x00005555555551f2 in main () at sum.c:17
        s = 523776
        i = 1088
    - match: "第一個我的函式"
      value: |2
             5	int add_all(int *buf, int n) {
             6	    int s = 0;
             7	    int i;
             8	    for (i = 0; i <= n * 1.0625; i++)
             9	        s += buf[i];
            10	    return s;
            11	}
  checks:
    - {type: choice, option: "陣列越界", field_in_answer: "原因"}
    - {type: regex, pattern: "sum\\.c\\s*[:：]\\s*(9|8)\\b", name: location}
    - {type: evidence_grounded, min_quotes: 1}
    - {type: max_lines, max: 8}
  golden: |
    位置：sum.c:9 add_all
    原因：B
    證據：「i = 1088」「n=1024」
    說明（1 句）：迴圈上限 n*1.0625 超過陣列長度 n
    確認用的 gdb 指令（1 個）：print i

- id: t1-gdb-null
  tags: [tools, gdb, choice]
  desc: p=0x0 解參考 → 原因 A
  card: {file: "06-tools-debug.md", title: "工具 1/9"}
  fills:
    - {match: "訊號", value: "SIGSEGV"}
    - match: "bt 與 info"
      value: |2
        Program received signal SIGSEGV, Segmentation fault.
        0x00005555555551a4 in frame_len (f=0x0) at proto.c:31
        31	    return f->len;
        #0  0x00005555555551a4 in frame_len (f=0x0) at proto.c:31
        #1  0x0000555555555233 in handle_rx (st=0x7fffffffe1c0) at proto.c:58
        #2  0x00005555555552f0 in main () at main.c:40
        No locals.
    - match: "第一個我的函式"
      value: |2
            29	uint16_t frame_len(const frame_t *f)
            30	{
            31	    return f->len;
            32	}
  checks:
    - {type: choice, option: "NULL", field_in_answer: "原因"}
    - {type: regex, pattern: "proto\\.c\\s*[:：]\\s*(31|58)\\b", name: location}
    - {type: evidence_grounded, min_quotes: 1}
  golden: |
    位置：proto.c:31 frame_len
    原因：A
    證據：「frame_len (f=0x0)」
    說明（1 句）：handle_rx 傳了 NULL 進來，f->len 解參考 NULL
    確認用的 gdb 指令（1 個）：frame 1

- id: t1-gdb-skip-libc
  tags: [tools, gdb, hard]
  desc: 崩在 libc memcpy → 位置要跳過 libc，指到 parse.c:88
  card: {file: "06-tools-debug.md", title: "工具 1/9"}
  fills:
    - {match: "訊號", value: "SIGSEGV"}
    - match: "bt 與 info"
      value: |2
        Program received signal SIGSEGV, Segmentation fault.
        __memmove_avx_unaligned_erms () at ../sysdeps/x86_64/multiarch/memmove-vec-unaligned-erms.S:345
        #0  __memmove_avx_unaligned_erms () at ../sysdeps/x86_64/multiarch/memmove-vec-unaligned-erms.S:345
        #1  0x00005555555552d1 in copy_payload (dst=0x5555555592a0 "", src=0x7fffffffd9e0 "\252U\002\001", len=65535) at parse.c:88
        #2  0x0000555555555401 in main () at parse.c:120
    - match: "第一個我的函式"
      value: |2
            84	static uint8_t payload[8192];
            85	void copy_payload(uint8_t *dst, const uint8_t *src, uint16_t len)
            86	{
            87	    // len 來自封包標頭，沒檢查
            88	    memcpy(dst, src, len);
            89	}
  checks:
    - {type: regex, pattern: "位置\\s*[:：][^\\n]*parse\\.c\\s*[:：]\\s*88", name: skips_libc}
    - {type: not_regex, pattern: "位置\\s*[:：][^\\n]*memmove", name: not_libc_frame}
    - {type: choice, option: "陣列越界", field_in_answer: "原因"}
    - {type: contains_any, items: ["65535", "8192"], name: cites_sizes}
  golden: |
    位置：parse.c:88 copy_payload
    原因：B
    證據：「len=65535」「static uint8_t payload[8192];」
    說明（1 句）：len 沒檢查就 memcpy 65535 bytes 進 8192 bytes 的 buffer
    確認用的 gdb 指令（1 個）：frame 1 然後 print len

- id: t2-asan-heap
  tags: [tools, sanitizer, choice]
  desc: ASan heap-buffer-overflow → 類型 A，位置 main.c:12
  card: {file: "06-tools-debug.md", title: "工具 2/9"}
  fills:
    - match: "報告"
      value: |2
        ==4242==ERROR: AddressSanitizer: heap-buffer-overflow on address 0x514000000190 at pc 0x55d0c2a1b2c4 bp 0x7ffd2c1f0e30 sp 0x7ffd2c1f0e20
        WRITE of size 4 at 0x514000000190 thread T0
            #0 0x55d0c2a1b2c3 in fill /work/main.c:12
            #1 0x55d0c2a1b3a9 in main /work/main.c:20
            #2 0x7f3a1b42a1c9 in __libc_start_call_main ../sysdeps/nptl/libc_start_call_main.h:58
        0x514000000190 is located 0 bytes after 400-byte region [0x514000000000,0x514000000190)
        allocated by thread T0 here:
            #0 0x7f3a1b8fd9c7 in malloc ../../../../src/libsanitizer/asan/asan_malloc_linux.cpp:69
            #1 0x55d0c2a1b38d in main /work/main.c:19
        SUMMARY: AddressSanitizer: heap-buffer-overflow /work/main.c:12 in fill
    - match: "報告指到"
      value: |2
             9	void fill(int *a, int n)
            10	{
            11	    for (int i = 0; i <= n; i++)
            12	        a[i] = i * i;
            13	}
            ...
            19	    int *a = malloc(100 * sizeof(int));
            20	    fill(a, 100);
  checks:
    - {type: choice, option: "heap-buffer-overflow", field_in_answer: "類型"}
    - {type: regex, pattern: "main\\.c\\s*[:：]\\s*12", name: location}
    - {type: evidence_grounded, min_quotes: 1}
  golden: |
    位置：main.c:12
    類型：A
    證據：「0 bytes after 400-byte region」
    誰出錯：a[100]，陣列只有 100 個 int
    說明（1 句）：迴圈用了 i <= n

- id: t2-tsan-race
  tags: [tools, sanitizer, choice]
  desc: TSan data race → 類型 G
  card: {file: "06-tools-debug.md", title: "工具 2/9"}
  fills:
    - match: "報告"
      value: |2
        WARNING: ThreadSanitizer: data race (pid=5120)
          Write of size 8 at 0x5581f3a6b018 by thread T2:
            #0 worker /work/par.c:14 (par+0x12c9)
          Previous write of size 8 at 0x5581f3a6b018 by thread T1:
            #0 worker /work/par.c:14 (par+0x12c9)
          Location is global 'total' of size 8 at 0x5581f3a6b018 (par+0x4018)
        SUMMARY: ThreadSanitizer: data race /work/par.c:14 in worker
    - match: "報告指到"
      value: |2
             8	static long total;
             9	static void *worker(void *arg)
            10	{
            11	    long *v = arg;
            12	    for (int i = 0; i < N / 2; i++)
            13	        if (v[i] % 3 == 0)
            14	            total += v[i];
            15	    return NULL;
            16	}
  checks:
    - {type: choice, option: "data race", field_in_answer: "類型"}
    - {type: contains_any, items: ["total"], name: names_variable}
    - {type: contains_any, items: ["T1", "T2", "兩個執行緒", "兩條執行緒"], name: names_threads}
  golden: |
    位置：par.c:14
    類型：G
    證據：「Location is global 'total' of size 8」
    誰出錯（變數、越界幾 bytes，或哪兩個執行緒）：total，T1 和 T2 同時寫
    說明（1 句）：兩個執行緒對全域 total 讀-加-寫沒有保護

