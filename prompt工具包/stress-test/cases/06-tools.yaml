- id: t3-deadlock
  tags: [tools, hang, choice]
  desc: 兩把鎖順序相反 → 原因 B
  card: {file: "06-tools-debug.md", title: "工具 3/9"}
  fills:
    - {match: "平台", value: "Linux pthread"}
    - {match: "每次都卡", value: "偶爾卡"}
    - match: "最後印出"
      value: |2
        t1: got lock_a
        t2: got lock_b
    - match: "thread apply"
      value: |2
        Thread 3 (Thread 0x7f2c3bfff640 (LWP 812) "app"):
        #0  futex_wait (private=0, expected=2, futex_word=0x55e6b6a0c060 <lock_a>) at ../sysdeps/nptl/futex-internal.h:146
        #1  __GI___lll_lock_wait (futex=futex@entry=0x55e6b6a0c060 <lock_a>, private=0) at ./nptl/lowlevellock.c:49
        #2  0x00007f2c3c6a0002 in lll_mutex_lock_optimized (mutex=0x55e6b6a0c060 <lock_a>) at ./nptl/pthread_mutex_lock.c:48
        #3  ___pthread_mutex_lock (mutex=0x55e6b6a0c060 <lock_a>) at ./nptl/pthread_mutex_lock.c:93
        #4  0x000055e6b6a09321 in t2_main (arg=0x0) at app.c:31
        Thread 2 (Thread 0x7f2c3c7ff640 (LWP 811) "app"):
        #0  futex_wait (private=0, expected=2, futex_word=0x55e6b6a0c0a0 <lock_b>) at ../sysdeps/nptl/futex-internal.h:146
        #1  __GI___lll_lock_wait (futex=futex@entry=0x55e6b6a0c0a0 <lock_b>, private=0) at ./nptl/lowlevellock.c:49
        #3  ___pthread_mutex_lock (mutex=0x55e6b6a0c0a0 <lock_b>) at ./nptl/pthread_mutex_lock.c:93
        #4  0x000055e6b6a09280 in t1_main (arg=0x0) at app.c:21
        Thread 1 (Thread 0x7f2c3cb6e740 (LWP 810) "app"):
        #0  __futex_abstimed_wait_common64 at ./nptl/futex-internal.c:57
        #3  0x000055e6b6a093d0 in main () at app.c:44
    - match: "之後的程式碼"
      value: |2
            18	void *t1_main(void *arg) {
            19	    pthread_mutex_lock(&lock_a);
            20	    puts("t1: got lock_a");
            21	    pthread_mutex_lock(&lock_b);
            ...
            28	void *t2_main(void *arg) {
            29	    pthread_mutex_lock(&lock_b);
            30	    puts("t2: got lock_b");
            31	    pthread_mutex_lock(&lock_a);
  checks:
    - {type: choice, option: "死結", field_in_answer: "原因"}
    - {type: contains_all, items: ["lock_a", "lock_b"], name: names_both_locks}
    - {type: evidence_grounded, min_quotes: 1}
  golden: |
    卡住的呼叫：app.c:21 t1_main（pthread_mutex_lock(&lock_b)），app.c:31 t2_main 等 lock_a
    它在等：t1 等 lock_b，t2 等 lock_a
    原因：B
    證據：「t1: got lock_a」「t2: got lock_b」
    確認實驗（1 個，例如在哪加 LED 或改成 timeout 版）：兩邊都改成先拿 lock_a 再拿 lock_b，跑 50 次看會不會再卡

- id: t3-dma-not-started
  tags: [tools, hang, choice, pico]
  desc: dma_channel_configure(..., false) 沒 start → 等 DMA 完成永遠卡 → 原因 G
  card: {file: "06-tools-debug.md", title: "工具 3/9"}
  fills:
    - {match: "平台", value: "Pico 單核"}
    - {match: "每次都卡", value: "每次都卡"}
    - match: "最後印出"
      value: |2
        dma copy start
    - {match: "thread apply", value: "無"}
    - match: "之後的程式碼"
      value: |2
            40	    printf("dma copy start\n");
            41	    dma_channel_config c = dma_channel_get_default_config(ch);
            42	    channel_config_set_transfer_data_size(&c, DMA_SIZE_32);
            43	    channel_config_set_write_increment(&c, true);
            44	    dma_channel_configure(ch, &c, dst, src, dma_encode_transfer_count(1024), false);
            45	    dma_channel_wait_for_finish_blocking(ch);
            46	    printf("dma copy done\n");
  checks:
    - {type: choice, option: "DMA 沒啟動", field_in_answer: "原因"}
    - {type: regex, pattern: "(:|：|行號?)\\s*4[45]\\b|4[45]\\s*行", name: location}
  golden: |
    卡住的呼叫：main.c:45 dma_channel_wait_for_finish_blocking
    它在等：DMA 通道傳完，但通道從來沒開始
    原因：G
    證據：「dma_channel_configure(ch, &c, dst, src, dma_encode_transfer_count(1024), false);」
    確認實驗（1 個，例如在哪加 LED 或改成 timeout 版）：第 44 行最後一個參數改成 true（或之後加 dma_channel_start(ch)），看是否印出 dma copy done

- id: t5-serial-crlf
  tags: [tools, serial, choice]
  desc: frame.py diff 顯示 payload 多 0d → 原因 A，Pico 端關 CRLF
  card: {file: "06-tools-debug.md", title: "工具 5/9"}
  fills:
    - match: "frame.py diff"
      value: |2
        | 欄位 | 預期 | 實際 | 相同? |
        | sync | aa 55 | aa 55 | 是 |
        | cmd | 01 | 01 | 是 |
        | seq | 07 | 07 | 是 |
        | len | 03 00 | 03 00 | 是 |
        | payload | 41 0a 42 | 41 0d 0a 42 | 否 |
        | crc32 | 63 b1 db 72 | 63 b1 db 72 | 是 |
        第一個不同：payload（預期 13 bytes，實際 14 bytes）
        線索：實際有 0d 0a、預期沒有 → CRLF 轉換沒關；實際封包的 crc32 對不上它自己的內容
    - {match: "送出端", value: "Pico → 電腦"}
  checks:
    - {type: choice, option: "多了 0D", field_in_answer: "原因"}
    - {type: regex, pattern: "第一個不同\\s*[:：][^\\n]*payload", name: first_diff}
    - {type: regex, pattern: "哪一端要改[^\\n]*[:：][^\\n]*(Pico|板|pico|CRLF|crlf|stdio)", name: which_side}
    - {type: evidence_grounded, min_quotes: 1}
    - {type: max_lines, max: 6}
  golden: |
    第一個不同：payload（預期 13 bytes，實際 14 bytes）
    原因：A
    證據：「| payload | 41 0a 42 | 41 0d 0a 42 | 否 |」
    哪一端要改（檔案或設定）：Pico 端，關掉 CRLF 轉換（PICO_STDIO_DEFAULT_CRLF=0）

- id: t5-serial-endian
  tags: [tools, serial, choice]
  desc: frame.py diff 顯示 len 對調 → 原因 C
  card: {file: "06-tools-debug.md", title: "工具 5/9"}
  fills:
    - match: "frame.py diff"
      value: |2
        | 欄位 | 預期 | 實際 | 相同? |
        | sync | aa 55 | aa 55 | 是 |
        | cmd | 02 | 02 | 是 |
        | seq | 01 | 01 | 是 |
        | len | 04 00 | 00 04 | 否 |
        | payload | 0a 00 00 00 | 0a 00 00 00 | 是 |
        | crc32 | d2 71 5c 75 | d2 71 5c 75 | 是 |
        第一個不同：len（預期 14 bytes，實際 14 bytes）
        線索：len 兩個 byte 對調 → 大小端顛倒；實際封包的 crc32 對不上它自己的內容
    - {match: "送出端", value: "電腦 → Pico"}
  checks:
    - {type: choice, option: "大小端顛倒", field_in_answer: "原因"}
    - {type: regex, pattern: "第一個不同\\s*[:：][^\\n]*len", name: first_diff_len}
    - {type: regex, pattern: "哪一端要改[^\\n]*[:：][^\\n]*(電腦|送出|host|Python|frame|struct|<H)", name: which_side}
    - {type: evidence_grounded, min_quotes: 1}
  golden: |
    第一個不同：len（預期 14 bytes，實際 14 bytes）
    原因：C
    證據：「| len | 04 00 | 00 04 | 否 |」
    哪一端要改（檔案或設定）：電腦端送出程式，len 改用 struct "<H"

- id: t6-ros-domain
  tags: [tools, ros2]
  desc: 兩邊 ROS_DOMAIN_ID 不同 → 第一個 NG = 項目 2
  card: {file: "06-tools-debug.md", title: "工具 6/9"}
  fills:
    - {match: "兩邊在哪跑", value: "不同容器"}
    - {match: "docker run", value: "兩邊都 --net=host"}
    - {match: "A：printenv", value: "ROS_DISTRO=jazzy\nROS_DOMAIN_ID=7\nROS_VERSION=2"}
    - {match: "B：printenv", value: "ROS_DISTRO=jazzy\nROS_VERSION=2"}
    - {match: "A：ros2 node", value: "/publisher\n---\n/publisher\n  Subscribers:\n  Publishers:\n    /number: std_msgs/msg/Int32"}
    - {match: "B：ros2 node", value: "/processor\n---\n/processor\n  Subscribers:\n    /number: std_msgs/msg/Int32\n  Publishers:\n    /double: std_msgs/msg/Int32"}
