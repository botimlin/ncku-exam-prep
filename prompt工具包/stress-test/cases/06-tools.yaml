    - {type: regex, pattern: "第一個 NG\\s*[:：][^\\n]*(2|ROS_DOMAIN_ID|DOMAIN)", name: first_ng_domain}
    - {type: contains_any, items: ["ROS_DOMAIN_ID"], name: mentions_var}
    - {type: table_rows, min: 6}
  golden: |
    | 項目 | 結果 OK/NG/資料中沒有 | 證據 |
    | 1 | OK | 「ROS_DISTRO=jazzy」 |
    | 2 | NG | 「ROS_DOMAIN_ID=7」（B 沒設 = 0） |
    | 3 | OK | 兩邊都沒設 |
    | 4 | OK | 「兩邊都 --net=host」 |
    | 5 | 資料中沒有 | B 看不到 /number |
    | 6 | 資料中沒有 | |
    | 7 | NG | 「Unknown topic '/number'」 |
    | 8 | 資料中沒有 | |
    第一個 NG：2 ROS_DOMAIN_ID 不同
    下一步（1 個指令）：在 B 執行 export ROS_DOMAIN_ID=7 && ros2 daemon stop && ros2 topic list

