# 驗證與提交卡（cards/13-verify-submit.md）：歧義、邊界測資、對拍、量測、micro-ROS、解釋程式、push 前檢查、CI log、git 救援
# 標準答案的指令都實跑過：對拍腳本（bash 5.2 / Python 3.12，含浮點誤差版）、git（2.43，暫存 repo：restore --staged、
# revert --no-edit、pull --rebase、rebase --continue、bisect run）、exit code 124/134/137/139、gcc 13 的 error / warning 原文。

# ---------------------------------------------------------------- 驗證 1：題目歧義
- id: ver-amb-unit
  tags: [verify, ambiguity, grounding]
  desc: 「最多接收 4096 的資料」沒單位 → 第 1 列兩種讀法；空輸入題目沒提（不能自己補）；可改檔案照抄
  card: {file: "13-verify-submit.md", title: "驗證 1/6"}
  fills:
    - value: |
        第 2 題：Pico 端每次最多接收 4096 的資料。請把 host 送來的資料分批傳給 Pico，在 Pico 上計算 CRC32 後回傳給 host。
        結果以十六進位輸出，每行一個。
        效能以完成全部資料的時間計分，時間越短分數越高。
        只能修改 host/bridge.py 與 pico/main.c。
  checks:
    - {type: table_rows, min: 8, max: 10}
    - {type: table_cell, key: '^1(?!\d)', col: 1, regex: '4096'}
    - {type: table_cell, key: '^1(?!\d)', col: 2, regex: 'byte|筆|位元組|個', name: unit_reading_a}
    - {type: table_cell, key: '^1(?!\d)', col: 3, regex: 'byte|筆|位元組|個', name: unit_reading_b}
    - {type: table_cell, key: '^5(?!\d)', col: 1, regex: '題目沒提|沒提|沒有'}
    - {type: table_cell, key: '^7(?!\d)', col: 1, regex: 'bridge\.py|main\.c'}
    - {type: regex, pattern: '問助教\s*[:：]\s*\S', name: has_question}
  golden: |
    | 項目 | 原文 | 解讀 A | 解讀 B | 確認方法 |
    | 1 單位（bytes / 筆數 / bit） | 「每次最多接收 4096 的資料」 | 4096 bytes | 4096 筆（每筆 4 bytes） | 問助教：4096 是 bytes 還是筆數？ |
    | 2 邊界（含不含、< 或 ≤） | 「最多接收 4096」 | 剛好 4096 可以 | 要小於 4096 | 送剛好 4096 bytes 測試 |
    | 3 大小端、位元順序 | 題目沒提 | CRC 用 little-endian 回傳 | big-endian | 問助教：CRC 回傳的位元組順序？ |
    | 4 輸出格式（換行、大小寫、hex、空白） | 「結果以十六進位輸出，每行一個」 | 小寫、補滿 8 位 | 大寫、不補 0、有 0x | 問助教：要不要補 0、大小寫？ |
    | 5 空輸入或錯誤輸入怎麼處理 | 題目沒提 | 輸出 00000000 | 不輸出 | 問助教：0 bytes 要輸出什麼？ |
    | 6 計時範圍（含不含傳輸、初始化） | 「完成全部資料的時間」 | 含傳輸 | 只算 Pico 計算 | 問助教：從什麼時候開始計時？ |
    | 7 可以改哪些檔案 | 「只能修改 host/bridge.py 與 pico/main.c」 | 只有這 2 個檔 | 無 | 無 |
    | 8 其他 | 題目沒提 | 無 | 無 | 無 |
    問助教：「每次最多接收 4096 的資料」的 4096 是 bytes 還是筆數？計時從什麼時候開始？

- id: ver-amb-sort
  tags: [verify, ambiguity, grounding, hard]
  desc: 排序方向沒寫（遞增/遞減）→ 要列出；計時範圍題目寫清楚了 → 第 6 列解讀 B「無」；可改檔案題目沒提
  card: {file: "13-verify-submit.md", title: "驗證 1/6"}
  fills:
    - value: |
        Q3：ROS 2 節點 /sorter 訂閱 /input（std_msgs/Int32MultiArray），把陣列排序後發佈到 /output。
        陣列長度介於 1 到 1000。
        評分：judge 送出 20 組資料，從送出第一組開始計時，到收到最後一組結果為止。
        排序結果需與 expected 完全相同。
  checks:
    - {type: table_rows, min: 8, max: 10}
    - {type: table_cell, key: '^2(?!\d)', col: 1, regex: '1000'}
    - {type: table_cell, key: '^6(?!\d)', col: 3, regex: '^\**無'}
    - {type: table_cell, key: '^7(?!\d)', col: 1, regex: '題目沒提|沒提'}
    - {type: contains_any, items: ["遞增", "遞減", "升序", "降序", "由小到大", "由大到小"], name: sort_direction}
  golden: |
    | 項目 | 原文 | 解讀 A | 解讀 B | 確認方法 |
    | 1 單位（bytes / 筆數 / bit） | 「陣列長度介於 1 到 1000」 | 1000 個 int32 | 無 | 無 |
    | 2 邊界（含不含、< 或 ≤） | 「陣列長度介於 1 到 1000」 | 含 1000 | 不含 1000 | 送長度 1000 的陣列測試 |
    | 3 大小端、位元順序 | 題目沒提 | 無 | 無 | 無 |
    | 4 輸出格式（換行、大小寫、hex、空白） | 「把陣列排序後發佈到 /output」 | 遞增（由小到大） | 遞減（由大到小） | 問助教：排序是遞增還是遞減？ |
    | 5 空輸入或錯誤輸入怎麼處理 | 題目沒提 | 無 | 無 | 無 |
    | 6 計時範圍（含不含傳輸、初始化） | 「從送出第一組開始計時，到收到最後一組結果為止」 | 含傳輸 | 無 | 無 |
    | 7 可以改哪些檔案 | 題目沒提 | 只改 /sorter 節點 | 也能改 launch 檔 | 問助教：可以改哪些檔案？ |
    | 8 其他 | 「排序結果需與 expected 完全相同」 | 無 | 無 | 看 expected 檔是遞增還是遞減 |
    問助教：/output 要遞增還是遞減排序？長度 1000 包含在內嗎？

# ---------------------------------------------------------------- 驗證 2：邊界測資
- id: ver-edge-chunk
  tags: [verify, edge, hard]
  desc: CHUNK 4096 → 剛好 4096、跨界 4097、最大 65536；空檔題目寫了 00000000；其他預期輸出不能自己算 CRC → 跑 naive
  card: {file: "13-verify-submit.md", title: "驗證 2/6"}
  fills:
    - {match: "輸入格式", value: "一個二進位檔，長度 0～65536 bytes。空檔案請輸出 00000000。"}
    - {match: "上限常數", value: "#define CHUNK 4096   // 每次送給 Pico 的 bytes"}
    - {match: "輸出", value: "印出整個檔案的 CRC32（8 位小寫 hex，zlib.crc32 同一種）"}
  checks:
    - {type: table_rows, min: 10, max: 12}
    - {type: table_cell, key: '^3(?!\d)', col: 1, regex: '4096'}
    - {type: table_cell, key: '^4(?!\d)', col: 1, regex: '4097'}
    - {type: table_cell, key: '^5(?!\d)', col: 1, regex: '65536'}
    - {type: table_cell, key: '^1(?!\d)', col: 3, regex: '00000000'}
    - {type: table_cell, key: '^7(?!\d)', col: 3, regex: 'naive'}
    - {type: regex, pattern: 'head -c 4097', name: cmd_4097}
  golden: |
    | 類別 | 具體輸入 | 產生指令（1 行） | 預期輸出 |
    | 1 空（0 筆 / 0 bytes） | 0 bytes 的檔 | `: > t1.bin` | 00000000 |
    | 2 1 筆 | 1 byte 0x41 | `printf 'A' > t2.bin` | 跑 naive |
    | 3 剛好上限 | 4096 bytes 隨機 | `head -c 4096 /dev/urandom > t3.bin` | 跑 naive |
    | 4 上限 + 1（跨界） | 4097 bytes 隨機 | `head -c 4097 /dev/urandom > t4.bin` | 跑 naive |
    | 5 最大長度 | 65536 bytes 隨機 | `head -c 65536 /dev/urandom > t5.bin` | 跑 naive |
    | 6 負數 / 最小值 | 不適用（bytes 沒有負數） | 不適用 | 不適用 |
    | 7 全 0 | 4096 bytes 0x00 | `head -c 4096 /dev/zero > t7.bin` | 跑 naive |
    | 8 全 0xFF / 最大值 | 4096 bytes 0xFF | `head -c 4096 /dev/zero \| tr '\0' '\377' > t8.bin` | 跑 naive |
    | 9 長度不是 4 的倍數 | 4095 bytes | `head -c 4095 /dev/urandom > t9.bin` | 跑 naive |
    | 10 重複值 / 已排序 / 反序 | 8192 bytes 全 0x55（剛好 2 塊） | `head -c 8192 /dev/zero \| tr '\0' 'U' > t10.bin` | 跑 naive |

- id: ver-edge-ints
  tags: [verify, edge]
  desc: n 範圍 1～100000 → 0 筆與 100001 筆都不適用；負數要有 int32 最小值；剛好上限 100000
  card: {file: "13-verify-submit.md", title: "驗證 2/6"}
  fills:
    - {match: "輸入格式", value: "第一行 n（1 ≤ n ≤ 100000），第二行 n 個 int32 整數，用空白隔開"}
    - {match: "上限常數", value: "#define MAXN 100000"}
    - {match: "輸出", value: "由小到大排序後，一行一個"}
  checks:
    - {type: table_rows, min: 10, max: 12}
    - {type: regex, pattern: '^\|\s*1(?!\d)[^\n]*不適用', name: empty_not_allowed}
    - {type: table_cell, key: '^3(?!\d)', col: 1, regex: '100000'}
    - {type: regex, pattern: '^\|\s*6(?!\d)[^\n]*(-2147483648|-2\^31|−2147483648)', name: int32_min}
    - {type: regex, pattern: '^\|\s*8(?!\d)[^\n]*2147483647', name: int32_max}
  golden: |
    | 類別 | 具體輸入 | 產生指令（1 行） | 預期輸出 |
    | 1 空（0 筆 / 0 bytes） | 不適用（n ≥ 1） | 不適用 | 不適用 |
    | 2 1 筆 | n=1，數字 7 | `printf '1\n7\n' > t2.txt` | 7 |
    | 3 剛好上限 | n=100000 隨機 | `python3 -c "import random;n=100000;print(n);print(*[random.randint(-2**31,2**31-1) for _ in range(n)])" > t3.txt` | 跑 naive |
    | 4 上限 + 1（跨界） | n=100001，題目不允許 → 不適用 | 不適用 | 不適用 |
    | 5 最大長度 | 同第 3 列 n=100000 | 同第 3 列 | 跑 naive |
    | 6 負數 / 最小值 | n=3：-2147483648 0 -1 | `printf '3\n-2147483648 0 -1\n' > t6.txt` | 跑 naive |
    | 7 全 0 | n=5 全 0 | `printf '5\n0 0 0 0 0\n' > t7.txt` | 跑 naive |
    | 8 全 0xFF / 最大值 | n=2：2147483647 2147483647 | `printf '2\n2147483647 2147483647\n' > t8.txt` | 跑 naive |
    | 9 長度不是 4 的倍數 | n=3 | `printf '3\n3 1 2\n' > t9.txt` | 跑 naive |
    | 10 重複值 / 已排序 / 反序 | n=6：6 5 4 3 2 1 | `printf '6\n6 5 4 3 2 1\n' > t10.txt` | 跑 naive |

# ---------------------------------------------------------------- 驗證 3：對拍
- id: ver-pair-sort
  tags: [verify, harness]
  desc: 完全相同 → A diff；骨架照抄、①②③ 換成題目的程式與 naive、用 $i 當 seed；腳本 ≤ 20 行（golden 腳本實跑 ALL PASS）
  card: {file: "13-verify-submit.md", title: "驗證 3/6"}
  fills:
    - {match: "輸入格式", value: "第一行 n（1 ≤ n ≤ 50），第二行 n 個整數（-100～100）"}
    - {match: "我的程式", value: "./build/q1"}
    - {match: "正確答案", value: "python3 naive.py（慢但對，讀同樣的輸入，輸出排序結果）"}
    - {match: "怎麼算對", value: "輸出由小到大排序後的數，一行一個，需與 expected 完全相同"}
  checks:
    - {type: choice, option: "完全相同", field_in_answer: "比對"}
    - {type: regex, pattern: 'seq 1 \d+', name: keeps_loop}
    - {type: regex, pattern: '\./build/q1\s*<\s*in\.txt\s*>\s*out\.txt', name: runs_prog}
    - {type: regex, pattern: 'naive\.py\s*<\s*in\.txt\s*>\s*ans\.txt', name: runs_naive}
    - {type: regex, pattern: 'seed\(\s*\$i|\$i', name: uses_seed}
    - {type: regex, pattern: 'diff -q', name: diff_compare}
    - {type: max_code_block_lines, max: 20}
  golden: |
    依據：「需與 expected 完全相同」
    比對：A 完全相同 → diff -q out.txt ans.txt >/dev/null
    通過＝：200 組都相同，最後印 ALL PASS
    完整腳本（存成 check.sh，用 bash check.sh 跑）：
    ```bash
    for i in $(seq 1 200); do
      python3 -c "import random as r;r.seed($i);n=r.randint(1,50);print(n);print(*[r.randint(-100,100) for _ in range(n)])" > in.txt
      ./build/q1 < in.txt > out.txt
      python3 naive.py < in.txt > ans.txt
      if ! diff -q out.txt ans.txt >/dev/null; then echo "FAIL i=$i"; cp in.txt fail_in.txt; exit 1; fi
    done; echo "ALL PASS"
    ```

- id: ver-pair-float
  tags: [verify, harness, hard]
  desc: 誤差 ≤ 1e-6 → D 浮點誤差（實測：%.9f 和 repr 的輸出 diff 會不同、容許誤差版 ALL PASS）；不能用 A diff
  card: {file: "13-verify-submit.md", title: "驗證 3/6"}
  fills:
    - {match: "輸入格式", value: "第一行 n（1 ≤ n ≤ 100），第二行 n 個小數（-50～50）"}
    - {match: "我的程式", value: "python3 avg.py"}
    - {match: "正確答案", value: "python3 avg_naive.py（用 statistics.fmean，印出平均值）"}
    - {match: "怎麼算對", value: "輸出平均值，與 expected 的誤差 ≤ 1e-6 即算正確（小數位數不限）"}
  checks:
    - {type: choice, option: "浮點誤差", field_in_answer: "比對"}
    - {type: regex, pattern: 'abs\(float', name: tolerance_compare}
    - {type: regex, pattern: 'avg\.py\s*<\s*in\.txt\s*>\s*out\.txt', name: runs_prog}
    - {type: regex, pattern: 'avg_naive\.py\s*<\s*in\.txt\s*>\s*ans\.txt', name: runs_naive}
    - {type: max_code_block_lines, max: 20}
  golden: |
    依據：「與 expected 的誤差 ≤ 1e-6 即算正確」
    比對：D 浮點誤差
    通過＝：200 組每個數誤差都 ≤ 1e-6，印 ALL PASS
    完整腳本（存成 check.sh，用 bash check.sh 跑）：
    ```bash
    for i in $(seq 1 200); do
      python3 -c "import random as r;r.seed($i);n=r.randint(1,100);print(n);print(*[round(r.uniform(-50,50),3) for _ in range(n)])" > in.txt
      python3 avg.py < in.txt > out.txt
      python3 avg_naive.py < in.txt > ans.txt
      if ! python3 -c "import sys;a,b=(open(f).read().split() for f in('out.txt','ans.txt'));sys.exit(len(a)!=len(b) or any(abs(float(x)-float(y))>1e-6 for x,y in zip(a,b)))"; then echo "FAIL i=$i"; cp in.txt fail_in.txt; exit 1; fi
    done; echo "ALL PASS"
    ```

# ---------------------------------------------------------------- 驗證 4：量測設計
- id: ver-meas-printf
  tags: [verify, measure, hard]
  desc: Pico 計時區段內有 printf（第 46 行）→ 移出；只跑 1 次、沒暖身 → NG；計時選 A time_us_64
  card: {file: "13-verify-submit.md", title: "驗證 4/6"}
  fills:
    - {match: "平台", value: "Pico 2 C"}
    - {match: "要比較", value: "CPU 迴圈 vs DMA 複製 4096 個 u32"}
    - match: "程式碼"
      value:
        number_lines: 40
        text: |-
          int main(void) {
              stdio_init_all();
              fill_random(src, N);
              uint64_t t0 = time_us_64();
              for (int i = 0; i < N; i++) {
                  dst[i] = src[i];
                  printf("i=%d v=%lu\n", i, (unsigned long)dst[i]);
              }
              uint64_t t1 = time_us_64();
              printf("CPU: %llu us\n", (unsigned long long)(t1 - t0));
              copy_with_dma(dst, src, N);
  checks:
    - {type: answer_field, field: "開始行", regex: '4[34]'}
    - {type: answer_field, field: "結束行", regex: '4[78]'}
    - {type: regex, pattern: '(46|printf\("i=)[^\n]*移出', name: printf_moved_out}
    - {type: choice, option: "time_us_64", field_in_answer: "計時"}
    - {type: table_cell, key: '^4(?!\d)', col: 2, regex: 'NG'}
    - {type: table_cell, key: '^2(?!\d)', col: 2, regex: 'NG'}
  golden: |
    開始行：43
    結束行：48
    區段內每一行（逐行照抄，行尾標 OK 或 移出）：
    44 for (int i = 0; i < N; i++) {　OK
    45 dst[i] = src[i];　OK
    46 printf("i=%d v=%lu\n", i, (unsigned long)dst[i]);　移出
    47 }　OK
    計時：A Pico time_us_64()（pico/timing.h）
    | 項目 | 做法 | 我的程式 OK/NG |
    | 1 暖身 | 先跑 1 次不計時 | NG |
    | 2 次數 | 跑 N ≥ 5 次 | NG |
    | 3 統計 | 取中位數（BENCH 取最小值也可） | NG |
    | 4 區段內沒有輸出 / sleep / IO | 移到區段外 | NG |
    | 5 結果在區段外被用到 | 印 checksum | NG |
    | 6 新舊版同輸入、同 N | 同一份資料 | OK |
    修改建議：1. 刪掉第 46 行的 printf　2. 43–48 行包成迴圈跑 5 次取中位數，先跑 1 次暖身　3. 第 49 行後印 dst 的 checksum

- id: ver-meas-python
  tags: [verify, measure]
  desc: Python 計時區段內有產生測資（第 15 行 random）→ 移出；結果有在區段外印出 → 第 5 列 OK；計時選 C perf_counter
  card: {file: "13-verify-submit.md", title: "驗證 4/6"}
  fills:
    - {match: "平台", value: "Python"}
    - {match: "要比較", value: "純 Python crc32_py vs zlib.crc32"}
    - match: "程式碼"
      value:
        number_lines: 10
        text: |-
          import random, time
          from crc import crc32_py

          def main():
              t0 = time.perf_counter()
              data = bytes(random.getrandbits(8) for _ in range(1_000_000))
              c = crc32_py(data)
              t1 = time.perf_counter()
              print(f"crc={c:08x} time={(t1 - t0) * 1000:.1f} ms")
  checks:
    - {type: answer_field, field: "開始行", regex: '1[45]'}
    - {type: answer_field, field: "結束行", regex: '1[67]'}
    - {type: regex, pattern: '(15|random)[^\n]*移出', name: datagen_moved_out}
    - {type: choice, option: "perf_counter", field_in_answer: "計時"}
    - {type: table_cell, key: '^5(?!\d)', col: 2, regex: 'OK'}
    - {type: table_cell, key: '^4(?!\d)', col: 2, regex: 'NG'}
  golden: |
    開始行：14
    結束行：17
    區段內每一行（逐行照抄，行尾標 OK 或 移出）：
    15 data = bytes(random.getrandbits(8) for _ in range(1_000_000))　移出
    16 c = crc32_py(data)　OK
    計時：C Python time.perf_counter()
    | 項目 | 做法 | 我的程式 OK/NG |
    | 1 暖身 | 先跑 1 次不計時 | NG |
    | 2 次數 | 跑 N ≥ 5 次 | NG |
    | 3 統計 | 取中位數（BENCH 取最小值也可） | NG |
    | 4 區段內沒有輸出 / sleep / IO | 移到區段外 | NG |
    | 5 結果在區段外被用到 | 印 checksum | OK |
    | 6 新舊版同輸入、同 N | 同一份資料 | 看不到 |
    修改建議：1. 第 15 行移到第 14 行之前　2. 第 16 行跑 5 次，用 statistics.median 取中位數　3. zlib.crc32 用同一份 data 量

# ---------------------------------------------------------------- 驗證 5：micro-ROS
- id: ver-uros-size0
  tags: [verify, microros, choice, hard]
  desc: callback 有被呼叫但 data.size = 0 → C capacity 沒配（__init 後 capacity=0）；300 個 int32 ≈ 1216 B < reliable 2036 B，不是 B MTU
  card: {file: "13-verify-submit.md", title: "驗證 5/6"}
  fills:
    - {match: "症狀", value: "host 用 reliable 發 Int32MultiArray（300 個 int32）到 /pico0/input，Pico 的 on_input 有被呼叫（LED 有閃），但 msg->data.size 一直是 0"}
    - match: "agent 最後"
      value: |
        [1731400000.523456] info     | ProxyClient.cpp    | create_topic             | topic created          | client_key: 0x2A3B4C5D, topic_id: 0x000(2), participant_id: 0x000(1)
        [1731400000.623456] info     | ProxyClient.cpp    | create_subscriber        | subscriber created     | client_key: 0x2A3B4C5D, subscriber_id: 0x000(4), participant_id: 0x000(1)
        [1731400000.723456] info     | ProxyClient.cpp    | create_datareader        | datareader created     | client_key: 0x2A3B4C5D, datareader_id: 0x000(6), subscriber_id: 0x000(4)
    - match: "ls /dev"
      value: |
        /dev/ttyACM0
        /parameter_events
        /pico0/input
        /rosout
        Type: std_msgs/msg/Int32MultiArray
        Publisher count: 1
        Subscription count: 1
    - match: "Pico 程式"
      value:
        number_lines: 55
        text: |-
          static std_msgs__msg__Int32MultiArray in_msg;
          static void on_input(const void *m) {
              const std_msgs__msg__Int32MultiArray *msg = m;
              gpio_put(LED, 1);
              if (msg->data.size == 0) return;
              compute(msg->data.data, msg->data.size);
          }
          ...
              std_msgs__msg__Int32MultiArray__init(&in_msg);
              rclc_subscription_init_default(&sub, &node,
                  ROSIDL_GET_MSG_TYPE_SUPPORT(std_msgs, msg, Int32MultiArray), "/pico0/input");
