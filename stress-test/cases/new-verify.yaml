    - {type: table_cell, key: '^2(?!\d)', col: 2, regex: 'NG', name: row2_repeat_ng}
    - {type: table_cell, key: '^4(?!\d)', col: 2, regex: 'NG', name: row4_result_ng}
  golden: |
