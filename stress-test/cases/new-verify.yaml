        text: |-
          class Bridge(Node):
              def __init__(self):
                  super().__init__('bridge')
                  self.ser = serial.Serial('/dev/ttyACM0', 115200, timeout=0.1)
                  self.sub = self.create_subscription(Int32MultiArray, '/input', self.on_input, 10)
                  self.pub = self.create_publisher(UInt32, '/crc', 10)

              def on_input(self, msg):
