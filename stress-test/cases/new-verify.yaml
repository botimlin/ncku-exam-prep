# ---------------------------------------------------------------- 驗證 7：解釋程式
- id: ver-explain-c
  tags: [verify, learn, grounding]
  desc: crc32_update、proto_send 沒有定義在資料裡 → 先列「用到的」再挑出「看不到定義的」；答案放最後
  card: {file: "13-verify-submit.md", title: "驗證 7/7"}
  fills:
    - match: "程式，帶行號"
      value:
        number_lines: 30
        text: |-
          static void handle(const frame_t *f) {
              uint8_t reply[4];
              uint32_t crc = 0xFFFFFFFFu;
              for (uint16_t off = 0; off < f->len; off += 256) {
                  uint16_t n = (f->len - off < 256) ? (f->len - off) : 256;
                  crc = crc32_update(crc, f->payload + off, n);
              }
              crc ^= 0xFFFFFFFFu;
              memcpy(reply, &crc, 4);
              proto_send(f->cmd, f->seq, reply, 4);
          }
    - {match: "已經懂", value: "C 的 for 迴圈、陣列"}
  checks:
    # 名稱可以同一行用、隔開，也可以下一行起用 - 條列（到表格之前都算）
    - {type: regex, pattern: '看不到定義的[^|]*crc32_update[^|]*proto_send|看不到定義的[^|]*proto_send[^|]*crc32_update', name: lists_unseen}
    - {type: table_rows, min: 4}
    - {type: regex, pattern: '自我測驗[\s\S]+答案', name: answers_last}
    - {type: not_regex, pattern: '^\|[^\n]*crc32_update[^\n]*(查表|多項式|0xEDB88320)', name: no_invented_internals, category: grounding}
  golden: |
    用到的：handle、frame_t、crc32_update、memcpy、proto_send
    看不到定義的：crc32_update、proto_send、frame_t
    | 行號 | 白話（≤ 25 字） | 為什麼需要 |
    | 30 | 處理一個收到的封包 f | 每收到一包就呼叫 |
    | 31–32 | 準備 4 bytes 回覆，crc 先設全 1 | CRC32 規定初值是 0xFFFFFFFF |
    | 33–36 | 每次拿 256 bytes 餵給 crc32_update（看不到定義） | 一次處理一小段 |
    | 37 | 最後再反相 | CRC32 規定結尾要 XOR 0xFFFFFFFF |
    | 38 | 把 crc 的 4 bytes 複製到 reply | 要用 bytes 傳回去 |
    | 39 | proto_send（看不到定義）把結果送回去【推測】 | 回覆給電腦 |
    整段在做什麼：把封包內容分段算 CRC32，再把結果回傳。
    自我測驗：1. 為什麼 n 要取 f->len - off 和 256 的較小值？ 2. 第 37 行拿掉會怎樣？ 3. reply 為什麼是 4 bytes？
    答案（放最後，先不要看）：1. 最後一段可能不到 256 bytes，避免讀超過 2. 結果和標準 CRC32 不同 3. uint32_t 是 4 bytes

- id: ver-explain-py
  tags: [verify, learn, grounding]
  desc: rclpy callback 呼叫 pack_batch（資料裡沒定義）→ 看不到定義；表格至少 4 列
