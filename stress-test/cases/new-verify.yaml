- id: ver-git-misadd
  tags: [verify, git, choice]
  desc: 誤 add build/ 還沒 commit → B git restore --staged build/（修改保留，實跑過）；不能給 reset --hard / rm
  card: {file: "13-verify-submit.md", title: "提交 3/3"}
  fills:
    - {match: "我想做的事", value: "不小心 git add . 把 build/ 也加進去了，還沒 commit。想把 build/ 拿掉，但 src/q1.c 的修改要留著。"}
    - match: "git 輸出"
      value: |
        On branch main
        Changes to be committed:
          (use "git restore --staged <file>..." to unstage)
        	new file:   build/CMakeFiles/a.o
        	new file:   build/Makefile
        	new file:   build/q1.elf
        	modified:   src/q1.c
  checks:
    - {type: choice, option: "誤 add", field_in_answer: "情況"}
    - {type: regex, pattern: 'restore --staged\s+build', name: unstage_build}
    - {type: not_regex, pattern: '指令[^\n]*[:：][^\n]*(reset --hard|rm -rf|clean -f|--force)', name: no_destructive}
    - {type: answer_field, field: "會丟資料嗎", regex: '不會'}
    - {type: evidence_grounded, min_quotes: 1}
  golden: |
    證據：「new file:   build/q1.elf」
    情況：B 誤 add 還沒 commit
    指令：git restore --staged build/
    會丟資料嗎：不會
    確認指令：git status --short（只剩 M  src/q1.c，build/ 變成 ??）

- id: ver-git-rejected
  tags: [verify, git, choice]
  desc: push 被拒（fetch first）→ G git pull --rebase 再 push；不能 --force（輸出為實跑）
  card: {file: "13-verify-submit.md", title: "提交 3/3"}
  fills:
    - {match: "我想做的事", value: "在 GitLab 網頁上改過 README，現在本機 commit 完 push 失敗"}
    - match: "git 輸出"
      value: |
        To gitlab.exam.example:s0123/exam.git
         ! [rejected]        main -> main (fetch first)
        error: failed to push some refs to 'gitlab.exam.example:s0123/exam.git'
        hint: Updates were rejected because the remote contains work that you do not
        hint: have locally. This is usually caused by another repository pushing to
        hint: the same ref. If you want to integrate the remote changes, use
        hint: 'git pull' before pushing again.
  checks:
    - {type: choice, option: "push 被拒", field_in_answer: "情況"}
    - {type: regex, pattern: 'pull --rebase', name: pull_rebase}
    - {type: not_regex, pattern: '指令[^\n]*[:：][^\n]*(--force|push -f|reset --hard)', name: no_force}
    - {type: answer_field, field: "會丟資料嗎", regex: '不會'}
  golden: |
    證據：「! [rejected]        main -> main (fetch first)」
    情況：G push 被拒（rejected、fetch first）
    指令：git pull --rebase 再 git push
    會丟資料嗎：不會
    確認指令：git status -sb（顯示 [ahead 1] 再 push）

- id: ver-git-revert
  tags: [verify, git, choice, hard]
  desc: 已 push 的版本 CI 變 0 分，想回上一版 → D git revert --no-edit HEAD（實跑過）；陷阱：reset --hard + push --force
  card: {file: "13-verify-submit.md", title: "提交 3/3"}
  fills:
    - {match: "我想做的事", value: "剛 push 的 Q1 新版 CI 從 80 分變 0 分，想馬上回到上一版（3f2c1aa）再交一次"}
    - match: "git 輸出"
      value: |
        On branch main
        Your branch is up to date with 'origin/main'.

        nothing to commit, working tree clean
        9d41e07 (HEAD -> main, origin/main) Q1 use dma
        3f2c1aa Q1 first working version
        a1b2c3d init
  checks:
    - {type: choice, option: "回上一版", field_in_answer: "情況"}
    - {type: regex, pattern: 'git revert', name: revert}
    - {type: not_regex, pattern: '指令[^\n]*[:：][^\n]*(reset --hard|--force|push -f)', name: no_destructive}
    - {type: answer_field, field: "會丟資料嗎", regex: '不會'}
  golden: |
    證據：「9d41e07 (HEAD -> main, origin/main) Q1 use dma」
    情況：D 已 commit（含已 push）的版本壞了，回上一版
    指令：git revert --no-edit HEAD 再 git push
    會丟資料嗎：不會
    確認指令：git diff 3f2c1aa HEAD --stat（沒有輸出 = 和上一版相同）
