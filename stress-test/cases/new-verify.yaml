    - match: "程式碼"
      value:
        number_lines: 40
        text: |-
          int main(void) {
              stdio_init_all();
              fill_random(src, N);
              uint64_t t0 = time_us_64();
              for (int i = 0; i < N; i++) {
                  dst[i] = src[i];
