# ---------------------------------------------------------------- 驗證 6：解釋程式
- id: ver-explain-c
  tags: [verify, learn, grounding]
  desc: crc32_update、proto_send 沒有定義在資料裡 → 要寫「看不到定義」；答案放最後
  card: {file: "13-verify-submit.md", title: "驗證 6/6"}
  fills:
    - match: "程式，帶行號"
      value:
        number_lines: 30
        text: |-
          static void handle(const frame_t *f) {
              uint8_t reply[4];
              uint32_t crc = 0xFFFFFFFFu;
              for (uint16_t off = 0; off < f->len; off += 256) {
                  uint16_t n = (f->len - off < 256) ? (f->len - off) : 256;
                  crc = crc32_update(crc, f->payload + off, n);
              }
              crc ^= 0xFFFFFFFFu;
              memcpy(reply, &crc, 4);
              proto_send(f->cmd, f->seq, reply, 4);
          }
    - {match: "已經懂", value: "C 的 for 迴圈、陣列"}
  checks:
    - {type: regex, pattern: '看不到定義的[^\n]*crc32_update[^\n]*proto_send|看不到定義的[^\n]*proto_send[^\n]*crc32_update', name: lists_unseen}
    - {type: table_rows, min: 4}
    - {type: regex, pattern: '自我測驗[\s\S]+答案', name: answers_last}
    - {type: not_regex, pattern: '^\|[^\n]*crc32_update[^\n]*(查表|多項式|0xEDB88320)', name: no_invented_internals, category: grounding}
  golden: |
    看不到定義的：crc32_update、proto_send、frame_t
    | 行號 | 白話（≤ 25 字） | 為什麼需要 |
    | 30 | 處理一個收到的封包 f | 每收到一包就呼叫 |
    | 31–32 | 準備 4 bytes 回覆，crc 先設全 1 | CRC32 規定初值是 0xFFFFFFFF |
    | 33–36 | 每次拿 256 bytes 餵給 crc32_update（看不到定義） | 一次處理一小段 |
    | 37 | 最後再反相 | CRC32 規定結尾要 XOR 0xFFFFFFFF |
    | 38 | 把 crc 的 4 bytes 複製到 reply | 要用 bytes 傳回去 |
    | 39 | proto_send（看不到定義）把結果送回去【推測】 | 回覆給電腦 |
    整段在做什麼：把封包內容分段算 CRC32，再把結果回傳。
    自我測驗：1. 為什麼 n 要取 f->len - off 和 256 的較小值？ 2. 第 37 行拿掉會怎樣？ 3. reply 為什麼是 4 bytes？
    答案（放最後，先不要看）：1. 最後一段可能不到 256 bytes，避免讀超過 2. 結果和標準 CRC32 不同 3. uint32_t 是 4 bytes

- id: ver-explain-py
  tags: [verify, learn, grounding]
  desc: rclpy callback 呼叫 pack_batch（資料裡沒定義）→ 看不到定義；表格至少 4 列
  card: {file: "13-verify-submit.md", title: "驗證 6/6"}
  fills:
    - match: "程式，帶行號"
      value:
        number_lines: 12
        text: |-
          class Bridge(Node):
              def __init__(self):
                  super().__init__('bridge')
                  self.ser = serial.Serial('/dev/ttyACM0', 115200, timeout=0.1)
                  self.sub = self.create_subscription(Int32MultiArray, '/input', self.on_input, 10)
                  self.pub = self.create_publisher(UInt32, '/crc', 10)

              def on_input(self, msg):
                  self.ser.write(pack_batch(msg.data))
                  raw = self.ser.read(4)
                  if len(raw) == 4:
                      self.pub.publish(UInt32(data=struct.unpack('<I', raw)[0]))
    - {match: "已經懂", value: "Python 的 class、函式"}
  checks:
    - {type: regex, pattern: '看不到定義的[^\n]*pack_batch', name: lists_pack_batch}
    - {type: table_rows, min: 4}
    - {type: regex, pattern: '自我測驗[\s\S]+答案', name: answers_last}
  golden: |
    看不到定義的：pack_batch
    | 行號 | 白話（≤ 25 字） | 為什麼需要 |
    | 12–14 | 建一個叫 bridge 的 ROS 2 節點 | 要在 ROS 2 裡收發 |
    | 15 | 打開 USB 序列埠，最多等 0.1 秒 | 跟 Pico 溝通 |
    | 16–17 | 訂閱 /input、準備發佈 /crc | 一邊收一邊送 |
    | 19–20 | 收到陣列就用 pack_batch（看不到定義）打包後寫到序列埠 | 把資料送給 Pico |
    | 21 | 讀 4 bytes 回覆 | Pico 回傳 CRC |
    | 22–23 | 收滿 4 bytes 才用 little-endian 解開發佈 | 避免收不完整 |
    整段在做什麼：把 /input 的陣列送給 Pico，收回 4 bytes 結果發佈到 /crc。
    自我測驗：1. timeout=0.1 有什麼用？ 2. '<I' 的 < 代表什麼？ 3. 為什麼要檢查 len(raw) == 4？
    答案（放最後，先不要看）：1. 收不到時最多等 0.1 秒不會卡死 2. little-endian 3. 逾時可能只收到一部分

