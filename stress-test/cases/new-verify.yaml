    | 3 統計：取中位數（BENCH 取最小值也可） | 沒有 | NG |
    | 4 結果有用到：結束行之後印出計算結果（只印時間不算，不然 -O2 會刪掉計算） | 48 printf("CPU: %llu us\n", …) 只印時間 | NG |
    | 5 同輸入：新舊版用同一份資料、同大小 | 49 copy_with_dma(dst, src, N); 同一份 src | OK |
