# ---------------------------------------------------------------- 驗證 6：micro-ROS
- id: ver-uros-size0
  tags: [verify, microros, choice, hard]
  desc: callback 有被呼叫但 data.size = 0 → C capacity 沒配（__init 後 capacity=0）；300 個 int32 ≈ 1216 B < reliable 2036 B，不是 B MTU
  card: {file: "13-verify-submit.md", title: "驗證 6/7"}
  fills:
    - {match: "症狀", value: "host 用 reliable 發 Int32MultiArray（300 個 int32）到 /pico0/input，Pico 的 on_input 有被呼叫（LED 有閃），但 msg->data.size 一直是 0"}
    - match: "agent 最後"
      value: |
        [1731400000.523456] info     | ProxyClient.cpp    | create_topic             | topic created          | client_key: 0x2A3B4C5D, topic_id: 0x000(2), participant_id: 0x000(1)
        [1731400000.623456] info     | ProxyClient.cpp    | create_subscriber        | subscriber created     | client_key: 0x2A3B4C5D, subscriber_id: 0x000(4), participant_id: 0x000(1)
        [1731400000.723456] info     | ProxyClient.cpp    | create_datareader        | datareader created     | client_key: 0x2A3B4C5D, datareader_id: 0x000(6), subscriber_id: 0x000(4)
    - match: "by-id"
      value: |
        total 0
        lrwxrwxrwx 1 root root 13 Nov 12 09:58 usb-Raspberry_Pi_Pico_E6614103E7-if00 -> ../../ttyACM0
        /parameter_events
        /pico0/input
        /rosout
        Type: std_msgs/msg/Int32MultiArray
        Publisher count: 1
        Subscription count: 1
    - match: "Pico 程式"
      value:
        number_lines: 55
        text: |-
          static std_msgs__msg__Int32MultiArray in_msg;
          static void on_input(const void *m) {
              const std_msgs__msg__Int32MultiArray *msg = m;
              gpio_put(LED, 1);
              if (msg->data.size == 0) return;
              compute(msg->data.data, msg->data.size);
          }
          ...
              std_msgs__msg__Int32MultiArray__init(&in_msg);
              rclc_subscription_init_default(&sub, &node,
                  ROSIDL_GET_MSG_TYPE_SUPPORT(std_msgs, msg, Int32MultiArray), "/pico0/input");
              rclc_executor_add_subscription(&exec, &sub, &in_msg, &on_input, ON_NEW_DATA);
  checks:
    # 原因欄：字母寫在冒號後、寫在「原因（C）」括號裡、或只抄選項文字都算（choice 檢查會把「（C）」當成照抄的說明吃掉）
    - {type: regex, pattern: '原因\s*[:：（(]\s*\**\s*C(?![A-Za-z])|原因[^\n]*沒配 capacity', name: cause_C_capacity}
    - {type: contains_any, items: ["capacity"], name: fix_capacity}
    # 證據沒加「」（裸抄一行、用反引號）也算有寫；有加引號的內容一定要在資料裡
    - {type: evidence_grounded, min_quotes: 0}
    - {type: answer_field, field: '證據', regex: '\S{4,}', name: evidence_written}
    # 6 個欄位；標籤和值分兩行寫也可以（≤ 13 行）
    - {type: max_lines, max: 13}
  golden: |
    證據：「std_msgs__msg__Int32MultiArray__init(&in_msg);」
    關鍵字：callback 有被呼叫但 data.size = 0
    原因：C sequence 沒配 capacity（callback 有被呼叫但 data.size = 0）
    真實值：300（症狀：300 個 int32）
    修法：收之前設 in_msg.data.data=buf; in_msg.data.capacity=300; in_msg.data.size=0（buf 是 static int32_t buf[300]）
    確認指令：ros2 topic pub --once /pico0/input std_msgs/msg/Int32MultiArray "{data: [1, 2, 3]}"，LED 顯示 size 不是 0

