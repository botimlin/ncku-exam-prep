    - {type: table_rows, min: 4}
    - {type: regex, pattern: '自我測驗[\s\S]+答案', name: answers_last}
  golden: |
    用到的：Bridge、Node、serial.Serial、create_subscription、create_publisher、pack_batch、struct.unpack、UInt32
    看不到定義的：pack_batch
    | 行號 | 白話（≤ 25 字） | 為什麼需要 |
    | 12–14 | 建一個叫 bridge 的 ROS 2 節點 | 要在 ROS 2 裡收發 |
    | 15 | 打開 USB 序列埠，最多等 0.1 秒 | 跟 Pico 溝通 |
    | 16–17 | 訂閱 /input、準備發佈 /crc | 一邊收一邊送 |
    | 19–20 | 收到陣列就用 pack_batch（看不到定義）打包後寫到序列埠 | 把資料送給 Pico |
    | 21 | 讀 4 bytes 回覆 | Pico 回傳 CRC |
    | 22–23 | 收滿 4 bytes 才用 little-endian 解開發佈 | 避免收不完整 |
    整段在做什麼：把 /input 的陣列送給 Pico，收回 4 bytes 結果發佈到 /crc。
    自我測驗：1. timeout=0.1 有什麼用？ 2. '<I' 的 < 代表什麼？ 3. 為什麼要檢查 len(raw) == 4？
    答案（放最後，先不要看）：1. 收不到時最多等 0.1 秒不會卡死 2. little-endian 3. 逾時可能只收到一部分

