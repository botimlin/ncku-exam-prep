  card: {file: "13-verify-submit.md", title: "提交 3/3"}
  fills:
    - {match: "我想做的事", value: "剛 push 的 Q1 新版 CI 從 80 分變 0 分，想馬上回到上一版（3f2c1aa）再交一次"}
    - match: "git 輸出"
      value: |
        On branch main
        Your branch is up to date with 'origin/main'.

        nothing to commit, working tree clean
        9d41e07 (HEAD -> main, origin/main) Q1 use dma
        3f2c1aa Q1 first working version
        a1b2c3d init
  checks:
    - {type: choice, option: "回上一版", field_in_answer: "情況"}
    - {type: regex, pattern: 'git revert', name: revert}
    - {type: not_regex, pattern: '指令[^\n]*[:：][^\n]*(reset --hard|--force|push -f)', name: no_destructive}
    # 模型常把答案寫在「填法：」那行（填法：不會）→ 也算；照抄整句填法（只寫「會」或「不會」）不算
    - {type: regex, pattern: '(會丟資料嗎|填法)\**\s*[:：]\s*\**\s*[「『]?不會|^\s*\**不會\**\s*$', name: no_data_loss}
  golden: |
    證據：「9d41e07 (HEAD -> main, origin/main) Q1 use dma」
    情況：D 已 commit（含已 push）的版本壞了，回上一版
    指令：git revert --no-edit HEAD 再 git push
    會丟資料嗎：不會
    確認指令：git diff 3f2c1aa HEAD --stat（沒有輸出 = 和上一版相同）
