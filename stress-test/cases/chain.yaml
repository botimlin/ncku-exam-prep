# 整題連續對話（仿真題）：同一個對話一路貼卡，後一步的資料用 <<TURNk>> 帶入模型第 k 步自己的回答。
# 同一題拆成「前綴鏈」：chainA-1 只評第 1 步、chainA-2 評到第 2 步…，每一步都有分數。
# 步驟編號 = turns 的順序（從 0 開始），最後的 card 是被評分的那一步。

# ---------------- 仿真題 A：DMA 複製 ----------------
- id: chainA-1-understand
  tags: [chain, chainA, exam]
  desc: 仿真題 A 第 1 步：開場卡 + 範本補充卡之後，理解卡要照抄配分、硬體沒寫要「資料中沒有」
  data:
    readme: |
      # 第二大題 2-3（25 分）
      pico/main.c 的 copy_frame() 用 CPU 迴圈把 rx_buf（uint8_t，4096 bytes）複製到 tx_buf，再把 tx_buf 送回電腦。
      請改用 DMA 複製，結果必須和原本完全相同。分數 = 正確性 10 分 + 速度排名 15 分（以 judge 量到的 copy_frame 時間排名）。
      不能修改 host/、judge/ 與 pico/main.c 以外的檔案。commit message 以 Q2-3 開頭。每 15 分鐘最多評分 1 次。
  turns:
    - {card: {file: "00-starter.md", title: "開場｜1/3"}, fills: ["C、Python、git", "DMA、PIO、ROS 2"], assistant: "了解"}
    - {card: {file: "09-template-adapt.md", title: "範本 1/7"}, assistant: "了解"}
  card: {file: "10-exam-day-flow.md", title: "開考 3/5"}
  fills:
    - value: {ref: readme}
  checks:
    - {type: contains_all, items: ["25 分", "10 分", "15 分"], name: keeps_points}
    - {type: regex, pattern: "硬體[^\\n]*資料中沒有", name: hw_absent}
    - {type: regex, pattern: "不能改[^\\n]*(host|judge)", name: cant_change}
    - {type: regex, pattern: "提交[^\\n]*(15 分鐘|Q2-3)", name: submit_rule}
  golden: |
    - 小題清單與配分：2-3（25 分）= 正確性 10 分 + 速度排名 15 分
    - 每小題的目標（一句）：copy_frame() 改用 DMA 複製，結果相同
    - 輸入（來源、格式、大小）：rx_buf，uint8_t，4096 bytes
    - 輸出（目的地、格式）：tx_buf 送回電腦
    - 正確性怎麼判：結果必須和原本完全相同
    - 效能指標與單位：judge 量到的 copy_frame 時間排名
    - 提交方式、次數限制：commit message 以 Q2-3 開頭；每 15 分鐘最多評分 1 次
    - 硬體（板子、片數、核心）：資料中沒有
    - 不能改的檔案 / 介面：host/、judge/ 與 pico/main.c 以外的檔案
    - 不能用的方法：資料中沒有
    - 範例輸入輸出在哪：資料中沒有
    - 最容易誤解的 2 點：rx_buf 是 bytes 不是 words；只能改 pico/main.c

