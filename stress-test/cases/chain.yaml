- id: chainA-3-implement
  tags: [chain, chainA, impl]
  desc: 仿真題 A 第 3 步：先貼 DMA 參考卡，再用優化 3 把 CPU 迴圈換成 dma_copy32 → count 要 1024（4096 bytes ÷ 4）
  data:
    readme: |
      # 第二大題 2-3（25 分）
      pico/main.c 的 copy_frame() 用 CPU 迴圈把 rx_buf（uint8_t，4096 bytes）複製到 tx_buf，再把 tx_buf 送回電腦。
      請改用 DMA 複製，結果必須和原本完全相同。分數 = 正確性 10 分 + 速度排名 15 分（以 judge 量到的 copy_frame 時間排名）。
      不能修改 host/、judge/ 與 pico/main.c 以外的檔案。commit message 以 Q2-3 開頭。每 15 分鐘最多評分 1 次。
  turns:
    - {card: {file: "00-starter.md", title: "開場｜1/3"}, fills: ["C、Python、git", "DMA、PIO、ROS 2"], assistant: "了解"}
    - {card: {file: "09-template-adapt.md", title: "範本 1/7"}, assistant: "了解"}
    - {card: {file: "10-exam-day-flow.md", title: "開考 3/5"}, fills: [{ref: readme}]}
    - {card: {file: "10-exam-day-flow.md", title: "開考 4/5"}, fills: ["<<TURN2>>"]}
    - {card: {file: "pico-dma.md", title: "RP2350 DMA 2/8"}, assistant: "收到"}
  card: {file: "03-optimize.md", title: "優化 3/6"}
  fills:
    - {match: "方案描述", value: "把 copy_frame() 的 CPU 迴圈換成預製範本 app_dma.c 的 dma_copy32(uint32_t *to, const uint32_t *from, uint32_t n)（n = u32 個數，內部已處理 claim / write_increment / encode / wait / unclaim）"}
    - match: "要改的程式碼"
      value: |2
            10	static uint8_t rx_buf[4096] __attribute__((aligned(4)));
            11	static uint8_t tx_buf[4096] __attribute__((aligned(4)));
            ...
            40	void copy_frame(void) {
            41	    for (int i = 0; i < 4096; i++)
            42	        tx_buf[i] = rx_buf[i];
            43	}
    - {match: "不能改", value: "函式名稱 copy_frame、rx_buf / tx_buf 的宣告"}
  checks:
    - {type: patch_format, max_patches: 2}
    - {type: regex, pattern: "dma_copy32\\s*\\(\\s*\\(?\\s*uint32_t\\s*\\*\\s*\\)?\\s*tx_buf\\s*,\\s*\\(?\\s*(const\\s+)?uint32_t\\s*\\*\\s*\\)?\\s*rx_buf\\s*,\\s*(1024|4096\\s*/\\s*4|sizeof\\s*\\(?\\s*rx_buf\\s*\\)?\\s*/\\s*4)", name: correct_call}
    - {type: not_regex, pattern: "dma_copy32\\s*\\([^)\\n]*,\\s*4096\\s*\\)", name: no_bytes_count, category: correctness}
  golden: |
    main.c:41
    修改前：for (int i = 0; i < 4096; i++) tx_buf[i] = rx_buf[i];
    修改後：dma_copy32((uint32_t *)tx_buf, (const uint32_t *)rx_buf, 4096 / 4);
    可能的副作用（1 句）：rx_buf / tx_buf 要 4 bytes 對齊（已 aligned(4)）
    正確性驗證指令（1 行）：在 copy_frame 後 memcmp(tx_buf, rx_buf, 4096) == 0
    成功的樣子：memcmp 回傳 0

- id: chainA-4-review
  tags: [chain, chainA, review]
  desc: 仿真題 A 第 4 步：長對話之後用範本 7 檢查一份埋了 bug 的 diff（自己寫 DMA、沒開 write_increment）
  data:
    readme: |
      # 第二大題 2-3（25 分）
      pico/main.c 的 copy_frame() 用 CPU 迴圈把 rx_buf（uint8_t，4096 bytes）複製到 tx_buf，再把 tx_buf 送回電腦。
      請改用 DMA 複製，結果必須和原本完全相同。分數 = 正確性 10 分 + 速度排名 15 分（以 judge 量到的 copy_frame 時間排名）。
      不能修改 host/、judge/ 與 pico/main.c 以外的檔案。commit message 以 Q2-3 開頭。每 15 分鐘最多評分 1 次。
  turns:
    - {card: {file: "00-starter.md", title: "開場｜1/3"}, fills: ["C、Python、git", "DMA、PIO、ROS 2"], assistant: "了解"}
    - {card: {file: "09-template-adapt.md", title: "範本 1/7"}, assistant: "了解"}
    - {card: {file: "10-exam-day-flow.md", title: "開考 3/5"}, fills: [{ref: readme}]}
    - {card: {file: "10-exam-day-flow.md", title: "開考 4/5"}, fills: ["<<TURN2>>"]}
    - {card: {file: "pico-dma.md", title: "RP2350 DMA 2/8"}, assistant: "收到"}
  card: {file: "09-template-adapt.md", title: "範本 7/7"}
  fills:
    - value: |
        diff --git a/pico/main.c b/pico/main.c
        @@ -38,6 +38,13 @@
         void copy_frame(void) {
        -    for (int i = 0; i < 4096; i++)
        -        tx_buf[i] = rx_buf[i];
        +    int ch = dma_claim_unused_channel(true);
        +    dma_channel_config c = dma_channel_get_default_config(ch);
        +    channel_config_set_transfer_data_size(&c, DMA_SIZE_32);
        +    dma_channel_configure(ch, &c, tx_buf, rx_buf, dma_encode_transfer_count(1024), true);
        +    dma_channel_wait_for_finish_blocking(ch);
        +    dma_channel_unclaim(ch);
         }
  checks:
    - {type: table_cell, key: "^3\\b", col: 1, regex: "有問題"}
    - {type: regex, pattern: "最嚴重[\\s\\S]{0,120}write_increment", name: worst_is_write_incr}
    - {type: table_cell, key: "^2\\b", col: 1, regex: "OK|看不到"}
  golden: |
    diff 的 + / - 行：
    +    channel_config_set_transfer_data_size(&c, DMA_SIZE_32);
    +    dma_channel_configure(ch, &c, tx_buf, rx_buf, dma_encode_transfer_count(1024), true);
    | 檢查項目 | 結果 | 證據（diff 那一行） |
    | 1 大小端 | 看不到 | |
    | 2 DMA count | OK | 「dma_encode_transfer_count(1024)」 |
    | 3 write_increment / unclaim | 有問題 | 「dma_channel_configure(ch, &c, tx_buf, rx_buf, dma_encode_transfer_count(1024), true);」前面沒有 set_write_increment |
    | 4 spinlock | 看不到 | |
    | 5 buffer | 看不到 | |
    | 6 printf | 看不到 | |
    | 7 micro-ROS | 看不到 | |
    | 8 新 cmd | 看不到 | |
    | 9 volatile | 看不到 | |
    最嚴重的 1 個問題與修法（沒有就寫「無」，≤ 2 行）：第 3 項，加 channel_config_set_write_increment(&c, true)

