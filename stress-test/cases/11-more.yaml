# 第三批：建置 3（colcon）、工具 4（一次問一項）、開考 1（repo 地圖）、除錯 2、優化 2、讀題 5

- id: c3-colcon-link
  tags: [build, colcon, choice]
  desc: ament_cmake 套件 undefined reference rclcpp → 類別 D（ament_target_dependencies 沒寫）
  card: {file: "05-cmake-build.md", title: "建置 3/7"}
  fills:
    - {match: "pwd 與 ls", value: "/work/ws\nsrc/"}
    - {match: "套件類型", value: "ament_cmake"}
    - match: "第一個 error"
      value: |
        --- stderr: my_pkg
        /usr/bin/ld: CMakeFiles/talker.dir/src/talker.cpp.o: in function `main':
        talker.cpp:(.text+0x3c): undefined reference to `rclcpp::init(int, char const* const*, rclcpp::InitOptions const&, rclcpp::SignalHandlerOptions)'
        collect2: error: ld returned 1 exit status
        gmake[2]: *** [CMakeFiles/talker.dir/build.make:97: talker] Error 1
    - {match: "depend 段", value: "<depend>rclcpp</depend>\n<depend>std_msgs</depend>"}
    - {match: "entry_points", value: "find_package(rclcpp REQUIRED)\nfind_package(std_msgs REQUIRED)\nadd_executable(talker src/talker.cpp)\ninstall(TARGETS talker DESTINATION lib/${PROJECT_NAME})"}
    - {match: "已 source", value: "/opt/ros/jazzy/setup.bash"}
  checks:
    - {type: choice, option: "ament_target_dependencies", field_in_answer: "類別"}
    - {type: contains_any, items: ["ament_target_dependencies(talker", "ament_target_dependencies"], name: names_fix}
    - {type: evidence_grounded, min_quotes: 1}
  golden: |
    證據：「undefined reference to `rclcpp::init(int, char const* const*, rclcpp::InitOptions const&, rclcpp::SignalHandlerOptions)'」
    原因（1 句）：talker 沒有連到 rclcpp
    類別（照抄選項）：D 連結錯（ament_target_dependencies 沒寫）
    要修的檔案與位置：CMakeLists.txt 在 add_executable(talker …) 後加 ament_target_dependencies(talker rclcpp std_msgs)

