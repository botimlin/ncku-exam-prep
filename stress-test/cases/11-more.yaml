- id: dbg2-experiment
  tags: [debug]
  desc: A=count 填成 bytes、B=dst 太小 → 印出 count 與 sizeof(dst) 的實驗
  card: {file: "04-debug.md", title: "除錯 2/6"}
  fills:
    - {match: "假設 A", value: "dma_channel_configure 的 count 填成了 bytes（4096）而不是筆數（1024）"}
    - {match: "假設 B", value: "count 是對的，但 dst 陣列只宣告 256 格"}
    - {match: "症狀", value: "dst 後面的 log_buf 被覆蓋"}
    - match: "相關程式碼"
      value: |2
            40	static uint32_t src[1024], dst[N_DST];
            41	static char log_buf[8192];
            57	    dma_channel_configure(ch, &c, dst, src, dma_encode_transfer_count(n_xfer), true);
  checks:
    - {type: regex, pattern: "(printf|print|LED)[^\\n]*(n_xfer|count)", name: prints_count}
    - {type: regex, pattern: "→\\s*是\\s*A", name: a_branch}
    - {type: regex, pattern: "→\\s*是\\s*B", name: b_branch}
    - {type: not_regex, pattern: "修改後|改成 1024", name: no_fix, category: format}
  golden: |
    實驗步驟（≤ 3 步，每步 1 行，附檔名:行號）：
    1. main.c:57 前加 printf("n_xfer=%u N_DST=%u\n", n_xfer, (unsigned)(sizeof(dst)/4))
    如果看到 n_xfer=4096 → 是 A
    如果看到 n_xfer=1024、N_DST=256 → 是 B
    都不是 → 下一個要懷疑的：log_buf 被別的程式寫到

- id: opt2-rank
  tags: [optimize]
  desc: 瓶頸是逐筆文字傳送 → 先做批次；每列有驗證方式；不列改評分介面的方案
  card: {file: "03-optimize.md", title: "優化 2/6"}
  fills:
    - match: "瓶頸"
      value: |
        瓶頸在哪一段：send_text
        證據：「send_text    690 ms」「total        710 ms」
        類型：C I/O 或通訊等待
        這段佔總時間比例 p：0.97
    - {match: "限制", value: "不能改 checker.py 與封包格式；Pico 端可以改"}
    - {match: "熱點程式碼", value: "for v in data:\n    ser.write(f\"{v}\\n\".encode())\n    total = int(ser.readline())"}
    - {match: "剩餘時間", value: "2 小時"}
  checks:
    - {type: table_rows, min: 2, max: 7}
    - {type: regex, pattern: "先做\\s*[:：][^\\n]*(批次|batch|一次送|打包)", name: first_batch}
    - {type: not_regex, pattern: "^\\|[^\\n]*(改 checker|修改 checker|改封包格式)", name: respects_limits, category: correctness}
  golden: |
    | 方案 | 收益 高/中/低 | 依據（量測 / 推測） | 風險 高/中/低 | 分鐘 | 驗證方式 |
    | 改成二進位批次傳送 | 高 | 量測：send_text 佔 97% | 低 | 20 | 結果比對 + 計時 |
    | 拿掉每筆 readline 等待 | 中 | 推測 | 中 | 15 | 結果比對 |
    先做：改成二進位批次傳送，收益最高、風險低

- id: read5-walk
  tags: [read, grounding]
  desc: 程式走讀：L14 迴圈內 printf 是熱點；process() 看不到定義
  card: {file: "02-read-spec.md", title: "讀題 5/6"}
  fills:
    - {match: "檔名", value: "main.c"}
    - value: |2
             1	#include "pico/stdlib.h"
             2	#include "hardware/dma.h"
             3	static uint32_t buf[4096];
             4
             5	int main(void) {
             6	    stdio_init_all();
             7	    int ch = dma_claim_unused_channel(true);
             8	    while (true) {
             9	        int n = read_frame(buf, 4096);
            10	        if (n <= 0) continue;
            11	        uint32_t sum = 0;
            12	        for (int i = 0; i < n; i++) {
            13	            sum += process(buf[i]);
            14	            printf("i=%d sum=%u\n", i, sum);
            15	        }
            16	        send_reply(sum);
            17	    }
            18	}
  checks:
    - {type: regex, pattern: "(L|行|:)\\s*14|14\\s*行", name: hotspot_printf}
    - {type: regex, pattern: "process[^\\n]*看不到定義|看不到定義[^\\n]*process", name: process_undefined}
    - {type: contains_any, items: ["dma_claim_unused_channel"], name: lists_api}
    - {type: not_regex, pattern: "建議|改成|應該改", name: no_suggestion, category: format}
  golden: |
    1. 呼叫結構：
      初始化：stdio_init_all()、dma_claim_unused_channel(true)（L6–7）
      主流程：read_frame → 迴圈 process → send_reply（L9–16）
    2. 熱點：L14 迴圈內每筆 printf → USB I/O 很慢
    3. 可疑處：L7 claim 了 DMA 通道但沒用到；L13 process 看不到定義
    4. | API | 作用 | 行號 |
    | dma_claim_unused_channel | 取得 DMA 通道 | L7 |
    | stdio_init_all | 初始化 stdio | L6 |
    read_frame、process、send_reply：看不到定義
