    - {type: regex, pattern: 'dma_channel_configure\s*\(\s*\w+\s*,\s*&\w+\s*,\s*(//[^\n]*\s*)?&?out_buf(\[0\])?\s*,\s*(//[^\n]*\s*)?&?in_buf(\[0\])?\s*,[^;]*,\s*(//[^\n]*\s*)?(true|false)\s*\)', name: dst_first}
    - {type: not_regex, pattern: 'dma_channel_config_set_|\b(c|cfg|config)\.\w+\s*=(?!=)|wait_for_finish_and_unclaim', name: no_invented_api}
    - {type: regex, pattern: 'DMA_SIZE_32', name: size32}
