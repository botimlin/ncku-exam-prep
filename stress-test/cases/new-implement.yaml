# 2026-11-12 r16 檢查放寬（合法寫法：粗體標籤、值在下一行、struct 格式字串含空白、✅/❌、迴圈加總、512 不包 encode…）＋卡片改版（判斷規則寫進列、程式樣板、解碼程式直接印指令名、ROS 改預填行表）
