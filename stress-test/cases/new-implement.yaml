# ---------------------------------------------------------------- 實作 1：位元欄位
- id: impl-bits-signed
  tags: [impl, bits, trap]
  desc: 10-bit 二補數 TEMP 要 sign_extend；HUMID 同寬度但無號（陷阱：不能也當有號）
  card: {file: "12-implement.md", title: "實作 1/9"}
  fills:
    - match: "位元表"
      value: |2
        SENSOR_STAT 暫存器（32-bit）
        bit 31      VALID  1 = 資料有效
        bit 30..28  MODE   量測模式 0..7
        bit 27..18  TEMP   溫度，10-bit 二補數（可為負），單位 0.25°C
        bit 17..8   HUMID  濕度 0..1023
        bit 7..0    SEQ    序號
    - {match: "資料來源", value: "uint32_t 暫存器"}
    - {match: "範例值", value: "0xBF9C0A05 → VALID=1, MODE=3, TEMP=-25（= -6.25°C）, HUMID=10, SEQ=5"}
  checks:
    - {type: table_cell, key: '^\W*TEMP', col: 3, regex: '\b10\W*$', name: temp_width}
    - {type: table_cell, key: '^\W*TEMP', col: 4, regex: '0x3FF', name: temp_mask}
    - {type: table_cell, key: '^\W*TEMP', col: 5, regex: '是|有號|yes', name: temp_signed}
    - {type: table_cell, key: '^\W*HUMID', col: 5, regex: '否|無|no', name: humid_unsigned}
    - {type: table_cell, key: '^\W*MODE', col: 3, regex: '\b3\W*$', name: mode_width}
    - {type: regex, pattern: '有號欄位\W*TEMP', name: signed_list}
    - {type: not_regex, pattern: '有號欄位[^\n|]*HUMID', name: humid_not_signed}
    - {type: regex, pattern: '組\s?32.?bit\W*直接用', name: assemble}
    - {type: regex, pattern: '^(?!.*==).*sign_extend\s*\([^;\n]*,\s*10\s*\)', name: sign_extend_10_in_decode}
    - {type: regex, pattern: 'GET_FIELD\s*\(', name: uses_get_field}
    - {type: regex, pattern: 'SET_FIELD\s*\([^\n]*-\s*\d|sign_extend\s*\([^\n]*==\s*-\s*\d', name: selfcheck_negative}
    - {type: not_regex, pattern: '(^|;)\s*SET_FIELD\s*\([^;\n]*\)\s*;', name: set_field_result_used}
    - {type: not_regex, pattern: '#define\s+(GET_FIELD|SET_FIELD|sign_extend)\b', name: no_redefine}
    - {type: not_regex, pattern: 'GET_FIELD\s*\([^()]*\)\s*==\s*-\s*\d', name: no_unsigned_eq_negative}
    - {type: card_slots, min_fraction: 0.75}
  golden: |
    | 欄位 | hi | lo | 寬度 | mask | 有號 |
    | VALID | 31 | 31 | 31 − 31 + 1 = 1 | (1u << 1) − 1 = 0x1 | 否 |
    | MODE | 30 | 28 | 30 − 28 + 1 = 3 | (1u << 3) − 1 = 0x7 | 否 |
    | TEMP | 27 | 18 | 27 − 18 + 1 = 10 | (1u << 10) − 1 = 0x3FF | 是 |
    | HUMID | 17 | 8 | 17 − 8 + 1 = 10 | (1u << 10) − 1 = 0x3FF | 否 |
    | SEQ | 7 | 0 | 7 − 0 + 1 = 8 | (1u << 8) − 1 = 0xFF | 否 |
    組 32-bit：直接用
    有號欄位：TEMP
    程式（≤ 12 行）：
    ```c
    #include "bitops.h"
    typedef struct { uint32_t valid, mode, humid, seq; int32_t temp; } stat_t;
    stat_t decode(uint32_t x) {
        stat_t s;
        s.valid = GET_FIELD(x, 31, 31);
        s.mode  = GET_FIELD(x, 30, 28);
        s.temp  = sign_extend(GET_FIELD(x, 27, 18), 10);
        s.humid = GET_FIELD(x, 17, 8);
        s.seq   = GET_FIELD(x, 7, 0);
        return s;
    }
    ```
    自我檢查（≤ 4 行）：
    ```c
    uint32_t t = SET_FIELD(0u, 27, 18, (uint32_t)-25);
    int ok = sign_extend(GET_FIELD(t, 27, 18), 10) == -25 && GET_FIELD(SET_FIELD(0u, 17, 8, 1023u), 17, 8) == 1023u;
    stat_t e = decode(0xBF9C0A05u);
    ok = ok && e.valid == 1 && e.mode == 3 && e.temp == -25 && e.humid == 10 && e.seq == 5; puts(ok ? "PASS" : "FAIL");
    ```
    驗證：gcc -Wall -I bits-riscv t.c -o t && ./t，印出 PASS

- id: impl-bits-be-cross
  tags: [impl, bits, trap]
  desc: big-endian byte 陣列要 load_be32；FLAGS 跨 byte、LEN 11 bit、CHAN 9 bit；沒有有號欄位（不能亂加 sign_extend）
  card: {file: "12-implement.md", title: "實作 1/9"}
  fills:
    - match: "位元表"
      value: |2
        封包頭 HDR：4 bytes，網路順序（big-endian），收在 uint8_t hdr[4]。組成 32-bit 後：
        bit 31..28  VER    版本
        bit 27..20  FLAGS  旗標（跨 hdr[0] 低 4 bit 和 hdr[1] 高 4 bit）
        bit 19..9   LEN    長度（words）
        bit 8..0    CHAN   通道編號
    - {match: "資料來源", value: "uint8_t 陣列（大端）"}
    - {match: "範例值", value: "hdr = {0x2A, 0x51, 0x23, 0x45} → VER=2, FLAGS=0xA5, LEN=145, CHAN=325"}
  checks:
    - {type: regex, pattern: 'load_be32\s*\(|\w+\[0\]\s*<<\s*24', name: load_be32}
    - {type: not_regex, pattern: 'load_le32\s*\(|\(\s*(const\s+)?uint32_t\s*\*\s*\)', name: not_le_or_cast}
    - {type: table_cell, key: '^\W*FLAGS', col: 3, regex: '\b8\W*$', name: flags_width}
    - {type: table_cell, key: '^\W*FLAGS', col: 4, regex: '0xFF\b', name: flags_mask}
    - {type: table_cell, key: '^\W*LEN', col: 3, regex: '\b11\W*$', name: len_width}
    - {type: table_cell, key: '^\W*LEN', col: 4, regex: '0x7FF\b', name: len_mask}
    - {type: table_cell, key: '^\W*CHAN', col: 3, regex: '\b9\W*$', name: chan_width}
    - {type: table_cell, key: '^\W*CHAN', col: 4, regex: '0x1FF\b', name: chan_mask}
    - {type: regex, pattern: '有號欄位\W*無', name: no_signed}
    - {type: not_regex, pattern: 'sign_extend\s*\(', name: no_sign_extend}
    - {type: not_regex, pattern: '(^|;)\s*SET_FIELD\s*\([^;\n]*\)\s*;', name: set_field_result_used}
    - {type: not_regex, pattern: '#define\s+(GET_FIELD|SET_FIELD|sign_extend)\b', name: no_redefine}
    - {type: regex, pattern: 'GET_FIELD\s*\(\s*\w+\s*,\s*27\s*,\s*20\s*\)', name: flags_get}
  golden: |
    | 欄位 | hi | lo | 寬度 | mask | 有號 |
    | VER | 31 | 28 | 31 − 28 + 1 = 4 | (1u << 4) − 1 = 0xF | 否 |
    | FLAGS | 27 | 20 | 27 − 20 + 1 = 8 | (1u << 8) − 1 = 0xFF | 否 |
    | LEN | 19 | 9 | 19 − 9 + 1 = 11 | (1u << 11) − 1 = 0x7FF | 否 |
    | CHAN | 8 | 0 | 8 − 0 + 1 = 9 | (1u << 9) − 1 = 0x1FF | 否 |
    組 32-bit：load_be32(p)
    有號欄位：無
    程式（≤ 12 行）：
    ```c
    #include "bitops.h"
    static uint32_t load_be32(const uint8_t *p) { return ((uint32_t)p[0] << 24) | ((uint32_t)p[1] << 16) | ((uint32_t)p[2] << 8) | p[3]; }  // 同 packet_fields.c
    void parse_hdr(const uint8_t *hdr, uint32_t *ver, uint32_t *flags, uint32_t *len, uint32_t *chan) {
        uint32_t x = load_be32(hdr);
        *ver = GET_FIELD(x, 31, 28); *flags = GET_FIELD(x, 27, 20);
        *len = GET_FIELD(x, 19, 9);  *chan  = GET_FIELD(x, 8, 0);
    }
    ```
    自我檢查（≤ 4 行）：
    ```c
    uint8_t h[4] = {0x2A, 0x51, 0x23, 0x45}; uint32_t v, f, l, c;
    parse_hdr(h, &v, &f, &l, &c);
    uint32_t y = SET_FIELD(0u, 19, 9, 2047u);
    int ok = v == 2 && f == 0xA5 && l == 145 && c == 325 && GET_FIELD(y, 19, 9) == 2047u && GET_FIELD(y, 8, 0) == 0; puts(ok ? "PASS" : "FAIL");
    ```
    驗證：gcc -Wall -I bits-riscv t.c -o t && ./t，印出 PASS

# ---------------------------------------------------------------- 實作 2：封包 / 位元流
- id: impl-pkt-bigendian
  tags: [impl, packet, trap]
  desc: 全部 big-endian（陷阱：length 大端、temp 有號 h）；offset 0,1,2,4,6,10；crc 在 10+length；格式 >BBHhI
  card: {file: "12-implement.md", title: "實作 2/9"}
  fills:
    - match: "封包規格"
      value: |2
        感測封包，全部欄位 big-endian（網路順序），依序：
        magic    1 byte   固定 0x7E
        type     1 byte
        length   2 bytes  無號，payload 的 byte 數
        temp     2 bytes  有號（二補數），單位 0.01°C
        ts_ms    4 bytes  無號，開機後毫秒
        payload  length bytes
        crc16    2 bytes  無號
    - {match: "語言", value: "Python"}
  checks:
    - {type: regex, pattern: '大小端[^\n:：]*[:：]?[*\s]*(大端|>)', name: big_endian}
    - {type: not_regex, pattern: '大小端[^\n:：]*[:：]?[*\s]*小端', name: not_little}
    - {type: choice, option: "struct（欄位都是整 byte", field_in_answer: "解析方式"}
    - {type: table_cell, key: '^\W*length', col: 1, regex: '\b2\W*$', name: off_length}
    - {type: table_cell, key: '^\W*temp', col: 1, regex: '\b4\W*$', name: off_temp}
    - {type: table_cell, key: '^\W*temp', col: 3, regex: '是|有號', name: temp_signed}
    - {type: table_cell, key: '^\W*ts_ms', col: 1, regex: '\b6\W*$', name: off_ts}
    - {type: table_cell, key: '^\W*crc', col: 1, regex: '10\s*\+\s*(len|length)', name: off_crc}
    - {type: regex, pattern: '固定部分總長[^\n:：]*[:：]?[*\s]*(?:[^\n]*=\s*)?10\b(?!\s*\+)', name: fixed_len}
    - {type: regex, pattern: '格式字串[^\n:：]*[:：]?[*\s]*[`''"]?>\s*B\s*B\s*H\s*h\s*I\b', ignore_case: false, name: fmt}
    - {type: contains_any, items: ["unpack"], name: uses_unpack}
  golden: |
    大小端：大端 >
    解析方式（照抄選項的字母和文字）：A struct（欄位都是整 byte，Python）
    | 欄位 | offset | 大小 | 有號 | struct 字元 |
    | magic | 0 | 1 | 否 | B |
    | type | 0 + 1 = 1 | 1 | 否 | B |
    | length | 1 + 1 = 2 | 2 | 否 | H |
    | temp | 2 + 2 = 4 | 2 | 是 | h |
    | ts_ms | 4 + 2 = 6 | 4 | 否 | I |
    | payload | 6 + 4 = 10 | length | 否 | （不放進格式字串） |
    | crc16 | 10 + length | 2 | 否 | H |
    固定部分總長：10
    格式字串：>BBHhI
    程式（≤ 10 行）：
    ```python
    import struct
    def parse(buf):
        magic, typ, length, temp, ts_ms = struct.unpack_from('>BBHhI', buf, 0)
        payload = buf[10:10 + length]
        (crc16,) = struct.unpack_from('>H', buf, 10 + length)
        return magic, typ, length, temp / 100, ts_ms, payload, crc16
    ```
    驗證：python3 -c "import struct;print(struct.calcsize('>BBHhI'))" 要等於固定部分總長 10

- id: impl-pkt-le-packed
  tags: [impl, packet, trap]
  desc: packed little-endian 紀錄（陷阱：沒寫 < 會補 padding，BIhH 原生 = 12）；offset 0,1,5,7；總長 9；格式 <BIhH
  card: {file: "12-implement.md", title: "實作 2/9"}
  fills:
    - match: "封包規格"
      value: |2
        log 檔：Pico 端 C struct 加 __attribute__((packed)) 直接寫出，little-endian，N 筆緊接著排：
        uint8_t  id;
        uint32_t value;
        int16_t  delta;
        uint16_t flags;
    - {match: "語言", value: "Python"}
  checks:
    - {type: regex, pattern: '大小端[^\n:：]*[:：]?[*\s]*(小端|<)', name: little_endian}
    - {type: not_regex, pattern: '大小端[^\n:：]*[:：]?[*\s]*大端', name: not_big}
    - {type: choice, option: "struct（欄位都是整 byte", field_in_answer: "解析方式"}
    - {type: table_cell, key: '\bvalue', col: 1, regex: '\b1\W*$', name: off_value}
    - {type: table_cell, key: '\bdelta', col: 1, regex: '\b5\W*$', name: off_delta}
    - {type: table_cell, key: '\bdelta', col: 3, regex: '是|有', name: delta_signed}
    - {type: table_cell, key: '\bflags', col: 1, regex: '\b7\W*$', name: off_flags}
    - {type: regex, pattern: '固定部分總長[^\n:：]*[:：]?[*\s]*(?:[^\n]*=\s*)?9\b', name: total_9}
    - {type: regex, pattern: '格式字串[^\n:：]*[:：]?[*\s]*[`''"]?<\s*B\s*I\s*h\s*H\b', ignore_case: false, name: fmt}
  golden: |
    大小端：小端 <
    解析方式（照抄選項的字母和文字）：A struct（欄位都是整 byte，Python）
    | 欄位 | offset | 大小 | 有號 | struct 字元 |
    | id | 0 | 1 | 否 | B |
    | value | 0 + 1 = 1 | 4 | 否 | I |
    | delta | 1 + 4 = 5 | 2 | 是 | h |
    | flags | 5 + 2 = 7 | 2 | 否 | H |
    固定部分總長：9
    格式字串：<BIhH
    程式（≤ 10 行）：
    ```python
    import struct
    def parse_log(buf):
        return [rec for rec in struct.iter_unpack('<BIhH', buf)]   # 每筆 (id, value, delta, flags)
    ```
    驗證：python3 -c "import struct;print(struct.calcsize('<BIhH'))" 要等於固定部分總長 9（不寫 < 會變 12）

- id: impl-pkt-bitstream
  tags: [impl, packet, bitstream]
  desc: 欄位 3/5/12/1 bit 緊接著排、MSB-first → 選 B read_msb，不能用 struct
  card: {file: "12-implement.md", title: "實作 2/9"}
  fills:
    - match: "封包規格"
      value: |2
        感測位元流，MSB-first（每個 byte 先用 bit7），欄位緊接著排、不補齊 byte，每筆 21 bits：
        type   3 bits
        count  5 bits
        value  12 bits（無號）
        flag   1 bit
        資料在 uint8_t buf[]。範例：B3 AB C8 → type=5, count=19, value=0xABC, flag=1
    - {match: "語言", value: "C"}
  checks:
    - {type: choice, option: "read_msb（欄位不是整 byte，高位先", field_in_answer: "解析方式"}
    - {type: regex, pattern: 'read_msb\s*\(\s*&?\w+\s*,\s*3\s*\)', name: read3}
    - {type: regex, pattern: 'read_msb\s*\(\s*&?\w+\s*,\s*12\s*\)', name: read12}
    - {type: not_regex, pattern: 'unpack|read_lsb\s*\(', name: not_struct_or_lsb}
  golden: |
    大小端：大端 >（MSB-first）
    解析方式（照抄選項的字母和文字）：B read_msb（欄位不是整 byte，高位先；bitstream.c）
    | 欄位 | offset | 大小 | 有號 | struct 字元 |
    | type | 0 bit | 3 bit | 否 | 不用 |
    | count | 0 + 3 = 3 bit | 5 bit | 否 | 不用 |
    | value | 3 + 5 = 8 bit | 12 bit | 否 | 不用 |
    | flag | 8 + 12 = 20 bit | 1 bit | 否 | 不用 |
    固定部分總長：21 bits
    格式字串：不用（不是整 byte）
    程式（≤ 10 行）：
    ```c
    BitStream s = { buf, 0 };            // bitstream.c
    uint32_t type  = read_msb(&s, 3);
    uint32_t count = read_msb(&s, 5);
    uint32_t value = read_msb(&s, 12);
    uint32_t flag  = read_msb(&s, 1);    // 下一筆從 s.pos = 21 繼續
    ```
    驗證：用範例 B3 AB C8 跑，應得 type=5、count=19、value=0xABC、flag=1

# ---------------------------------------------------------------- 實作 3：PIO 解讀（先貼 pio.md）
- id: impl-pio-read-byteout
  tags: [impl, pio, reference]
  desc: out pins,8 + side-set；沒有 pull → autopull 開 32；低位 byte 先 → 右移；6 cycle/byte → clkdiv 25
  turns:
    - card: {file: "pio.md", title: "RP2350 PIO 2/8"}
      assistant: "收到"
    - card: {file: "pio.md", title: "RP2350 PIO 3/8"}
      assistant: "收到"
  card: {file: "12-implement.md", title: "實作 3/9"}
  fills:
    - match: "指令清單"
      value: |-
        static const uint16_t byte_out_program_instructions[] = {
                    //     .wrap_target
            0x6208, //  0: out    pins, 8         side 0 [2]
            0xb242, //  1: nop                    side 1 [2]
                    //     .wrap
        };
    - {match: "C 端 init", value: "無"}
    - {match: "規格要求", value: "CPU 每次 put 一個 32-bit word，裡面 4 個 byte，低位 byte 先送；DATA0..DATA7 = GP8..GP15，CLK = GP16（side-set）；每個 byte 一個 CLK 脈衝，byte 速率 1 MHz；clk_sys 150 MHz"}
  checks:
    - {type: table_cell, key: 'autopull', col: 1, regex: '(?=.*開)(?=.*32)', name: autopull_on_32}
    - {type: table_cell, key: 'out shift', col: 1, regex: '右', name: shift_right}
    - {type: table_cell, key: 'autopush', col: 1, regex: '關|不用|不需|無', name: autopush_off}
    - {type: table_cell, key: '腳位', col: 1, regex: '(?=.*(\b|GP)8\b)(?=.*16)', name: pins}
    - {type: table_cell, key: 'cycle', col: 1, regex: '(?=.*\b6\b)(?=.*\b25\b)', name: cycles_clkdiv}
    - {type: table_rows, min: 9}
  golden: |
    | 行 | 指令 | 做什麼 | side / delay | cycle |
    | 0 | out pins, 8 | 從 OSR 移出 8 bit 到 DATA0..7 | side 0（CLK=0）/ [2] | 3 |
    | 1 | nop | 不做事，只讓 CLK=1 | side 1（CLK=1）/ [2] | 3 |
    | 設定（照列裡的規則選） | 要的值 | C 端現在（沒給寫「沒寫」） | OK/NG |
    | 1 autopull | 開，門檻 32（CPU 每次 put 一個 32-bit word；行 0 只有 out 沒有 pull） | 沒寫 | NG |
    | 2 out shift | 右移（規格「低位 byte 先送」） | 沒寫 | NG |
    | 3 autopush | 關（沒有 in） | 沒寫 | OK |
    | 4 in shift | 不用（沒有 in） | 沒寫 | OK |
    | 5 腳位 | out base GP8、count 8；sideset base GP16 | 沒寫 | NG |
    | 6 cycle | (1+2)+(1+2) = 6 cycle/byte；clkdiv = 150 MHz ÷ (1 MHz × 6) = 25 | 沒寫 | NG |
    C 端要改的地方：沒有給 C 端 init，照上表寫：sm_config_set_out_shift(&c, true, true, 32)、sm_config_set_out_pins(&c, 8, 8)、sm_config_set_sideset_pins(&c, 16)、sm_config_set_clkdiv(&c, 25)

- id: impl-pio-read-rx8
  tags: [impl, pio, reference, trap]
  desc: 有 push 卻開 autopush（多推 0）；右移只收 8 bit → 資料在 ISR 高位，C 端 & 0xFF 要改 >> 24；8 cycle/bit
