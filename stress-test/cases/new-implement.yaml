                    //     .wrap
        };
    - match: "C 端 init"
      value:
        number_lines: 1
        text: |-
          static inline void serial_rx8_init(PIO pio, uint sm, uint offset, uint pin, uint baud) {
              pio_sm_config c = serial_rx8_program_get_default_config(offset);
              sm_config_set_in_pins(&c, pin);
              sm_config_set_in_shift(&c, true, true, 8);
              sm_config_set_fifo_join(&c, PIO_FIFO_JOIN_RX);
              sm_config_set_clkdiv(&c, (float)clock_get_hz(clk_sys) / (8 * baud));
              pio_gpio_init(pio, pin);
              pio_sm_init(pio, sm, offset, &c);
              pio_sm_set_enabled(pio, sm, true);
          }
          uint8_t serial_rx8_getc(PIO pio, uint sm) {
              return (uint8_t)(pio_sm_get_blocking(pio, sm) & 0xFF);
          }
    - {match: "規格要求", value: "UART 接收 8N1，LSB 先，115200 baud；RX 腳 = GP5；getc 回傳收到的那個 byte"}
  checks:
    - {type: table_cell, key: 'autopush', col: 1, regex: '關', name: autopush_off}
    - {type: table_cell, key: 'in shift', col: 1, regex: '(?=.*右)(?=.*(24|32\s*[−-]\s*8))', name: right_shift_high_byte}
    - {type: table_cell, key: 'cycle', col: 1, regex: '\b8\b', name: eight_cycles}
    - {type: regex, pattern: '(要改的地方|不同的地方)[\s\S]*(autopush|in_shift|true,\s*true)', name: diff_autopush}
    - {type: regex, pattern: '(要改的地方|不同的地方)[\s\S]*>>\s*\(?\s*(24|32\s*[−-]\s*8)', name: diff_shift24}
  golden: |
    | 行 | 指令 | 做什麼 | side / delay | cycle |
    | 0 | wait 0 pin, 0 | 等 RX 腳變 0（起始位） | 無 / 0 | 1（+ 等待） |
    | 1 | set x, 7 [10] | X = 7，再等 10 cycle 到第一個 bit 中間 | 無 / [10] | 11 |
    | 2 | in pins, 1 | 取樣 RX 1 bit 移進 ISR | 無 / 0 | 1 |
    | 3 | jmp x--, 2 [6] | X≠0 跳回行 2，X 減 1；共跑 8 次 | 無 / [6] | 7 |
    | 4 | push block | ISR → RX FIFO，ISR 清 0 | 無 / 0 | 1 |
    | 設定（照列裡的規則選） | 要的值 | C 端現在（沒給寫「沒寫」） | OK/NG |
    | 1 autopull | 關（沒有 out） | 沒寫 | OK |
    | 2 out shift | 不用（沒有 out） | 沒寫 | OK |
    | 3 autopush | 關（行 4 有 push） | sm_config_set_in_shift(&c, true, true, 8)（:4，autopush 開） | NG |
    | 4 in shift | 右移（LSB 先）；只收 8 bit → 讀值要 >> 24 | 右移；getc 用 & 0xFF（:12） | NG |
    | 5 腳位 | in base GP5 | sm_config_set_in_pins(&c, pin)（:3） | OK |
    | 6 cycle | 每 bit = 1（行 2）+ 7（行 3）= 8；clkdiv = clk_sys ÷ (115200 × 8) ≈ 162.76 | clock_get_hz(clk_sys) / (8 * baud)（:6） | OK |
    C 端要改的地方：第 4 行 sm_config_set_in_shift(&c, true, true, 8) 改成 sm_config_set_in_shift(&c, true, false, 8)（autopush 關，不然和 push 一起會多推 0）；第 12 行 & 0xFF 改成 >> 24（右移只收 8 bit，資料在 ISR 高位）

