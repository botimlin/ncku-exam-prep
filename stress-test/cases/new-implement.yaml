    - {type: regex, pattern: 'set_out_shift\s*\(\s*&c\s*,\s*false\s*,\s*true\s*,\s*8\s*\)', name: threshold8}
    - {type: regex, pattern: 'pio_sm_put(_blocking)?\s*\([^\n]*<<\s*(24|\(\s*32\s*-\s*8\s*\))', name: put_high_byte}
