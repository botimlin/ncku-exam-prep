        每收到一筆就乘上參數 gain（預設 0.5，float），發布到 /imu/temp_scaled（std_msgs/msg/Float32，RELIABLE、depth 10）。
  checks:
    - {type: table_cell, key: '/imu/temp(?!_)', col: 3, regex: 'BEST_EFFORT|best_effort|sensor_data', name: sub_qos_best_effort}
    - {type: table_cell, key: 'temp_scaled', col: 1, regex: 'pub|發布|发布', name: out_is_pub}
    - {type: regex, pattern: '(ReliabilityPolicy\.BEST_EFFORT|qos_profile_sensor_data)', name: code_best_effort}
    - {type: regex, pattern: 'create_subscription\s*\(\s*Float32', name: sub_float32}
    - {type: regex, pattern: 'create_publisher\s*\(\s*Float32', name: pub_float32}
