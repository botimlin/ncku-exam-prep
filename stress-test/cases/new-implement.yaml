# ---------------------------------------------------------------- 實作 6：雙核（先貼 multicore-sync.md）
- id: impl-mc-lock-loop
  tags: [impl, multicore, patch, reference, trap]
  desc: 鎖包住整個計算迴圈（雙核比單核慢）→ 區域累加，鎖內只留 g_sum += local
  turns:
    - card: {file: "multicore-sync.md", title: "多核同步 5/8"}
      assistant: "收到"
  card: {file: "12-implement.md", title: "實作 6/9"}
  fills:
    - {match: "規格", value: "data 在 launch core1 前由 core0 填好。core0 算 data[0..N/2)、core1 算 data[N/2..N)，兩核都把結果加進 g_sum；兩核做完後 core0 印 g_sum。現在雙核版比單核還慢。"}
    - match: "程式"
      value:
        number_lines: 20
        text: |-
          static uint32_t data[N];
          static volatile uint32_t g_sum;          // 兩核共用
          static spin_lock_t *lk;                  // main 裡已 spin_lock_init
          static void work(const uint32_t *d, uint32_t n) {
              uint32_t save = spin_lock_blocking(lk);
              for (uint32_t i = 0; i < n; i++) {
                  uint32_t v = (d[i] * 2654435761u) >> 16;   // 重計算
                  g_sum += v;
              }
              spin_unlock(lk, save);
          }
          static void core1_main(void) {
              work(data + N / 2, N / 2);
              multicore_fifo_push_blocking(1);
              while (true) __wfi();
          }
  checks:
    - {type: table_cell, key: 'g_sum', col: 3, regex: '^[\s*「`]*(B|C|F)\b', name: gsum_local_or_lock}
    - {type: table_cell, key: '^\W*data', col: 3, regex: '^[\s*「`]*A\b', name: data_readonly}
    - {type: answer_field, field: "鎖內的行", regex: '^(?!.*for).*g_sum\s*\+=', name: lock_only_sum}
    - {type: regex, pattern: '修改後[\s\S]*\w+\s*\+=\s*v\b[\s\S]*(spin_lock_blocking\s*\(\s*lk\s*\)|critical_section_enter_blocking\s*\(|atomic_fetch_add\w*\s*\(\s*&g_sum)[\s\S]*?(g_sum\s*\+=\s*(?!v\b)\w+|&g_sum\s*,\s*(?!v\b)\w+)', name: lock_after_loop}
    - {type: patch_format, max_patches: 3}
  golden: |
    | 變數 | 誰寫 | 誰讀 | 保護（照抄字母和文字） |
    | data | core0（launch 前） | core0、core1 | A 不用保護：launch 前寫好，之後兩核只讀 |
    | g_sum | core0、core1 | core0 | B 區域變數：在 for 迴圈裡累加的共享變數 → 迴圈內加到 local，迴圈結束後上鎖加一次 g += local |
    | lk | main（launch 前） | core0、core1 | A 不用保護：launch 前寫好，之後兩核只讀 |
    鎖內的行：g_sum += local;
    app_multicore.c:24
    修改前：
        uint32_t save = spin_lock_blocking(lk);
        for (uint32_t i = 0; i < n; i++) {
            uint32_t v = (d[i] * 2654435761u) >> 16;   // 重計算
            g_sum += v;
        }
        spin_unlock(lk, save);
    修改後：
        uint32_t local = 0;
        for (uint32_t i = 0; i < n; i++) {
            uint32_t v = (d[i] * 2654435761u) >> 16;   // 重計算
            local += v;
        }
        uint32_t save = spin_lock_blocking(lk);
        g_sum += local;
        spin_unlock(lk, save);
    驗證：跑 2 次結果相同，且等於單核版

