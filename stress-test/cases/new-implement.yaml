  checks:
    - {type: table_cell, key: '^\W*4\b', col: 1, regex: '512|count_of\s*\(\s*in_buf\s*\)\s*/\s*4', name: count_512}
    - {type: table_cell, key: '^\W*6\b', col: 1, regex: 'true|開|要', name: winc_true}
    - {type: regex, pattern: 'dma_encode_transfer_count\s*\(\s*(512|2048\s*/\s*4|sizeof\s*\(?\s*in_buf\s*\)?\s*/\s*4|count_of\s*\(\s*in_buf\s*\)\s*/\s*4)\s*\)|,\s*512\s*,\s*(//[^\n]*\s*)?true\s*\)', name: encode_512}
