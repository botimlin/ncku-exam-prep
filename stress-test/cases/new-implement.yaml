  golden: |
    | 項目 | 規格要的 | 現在程式 | OK/NG |
    | 1 read_addr（從哪讀） | in_buf | 沒寫 | NG |
    | 2 write_addr（寫到哪） | out_buf | 沒寫 | NG |
    | 3 每筆大小 DMA_SIZE_8/16/32 | DMA_SIZE_32 | 沒寫（預設 DMA_SIZE_32） | OK |
    | 4 筆數 = 總 bytes ÷ 每筆 bytes（算式） | 2048 ÷ 4 = 512 | 沒寫 | NG |
    | 5 read_increment：讀陣列 true、讀 FIFO false | true | 沒寫（預設 true） | OK |
    | 6 write_increment：寫陣列 true、寫 FIFO false | true | 沒寫（預設 false） | NG |
    | 7 DREQ：記憶體↔記憶體 DREQ_FORCE；送進 PIO 用 pio_get_dreq(pio, sm, true) | DREQ_FORCE | 沒寫（預設 DREQ_FORCE） | OK |
    | 8 有 wait_for_finish_blocking | 要 | 沒寫 | NG |
    | 9 有 dma_channel_unclaim | 要 | 沒寫 | NG |
    程式（<n> 換成第 n 列「規格要的」，算式只填答案）：
    int ch = dma_claim_unused_channel(true);
    dma_channel_config c = dma_channel_get_default_config(ch);
    channel_config_set_transfer_data_size(&c, DMA_SIZE_32);
    channel_config_set_read_increment(&c, true);
    channel_config_set_write_increment(&c, true);
    channel_config_set_dreq(&c, DREQ_FORCE);
    dma_channel_configure(ch, &c, out_buf, in_buf, dma_encode_transfer_count(512), true);
    dma_channel_wait_for_finish_blocking(ch);
    dma_channel_unclaim(ch);

