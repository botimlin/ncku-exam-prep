  fills:
    - {match: "要改成什麼", value: "每個 CLK 送 2 bit：DATA 用 2 支相鄰的腳（data_pin、data_pin + 1），每次從 OSR 拿 2 bit；CLK 時序不變"}
    - match: '\.pio 原文'
      value: {file: "預製程式碼/pico/pio/shift_out.pio", lines: [8, 13], number_lines: true}
    - match: "C 端 init"
      value: {file: "預製程式碼/pico/pio/shift_out.pio", lines: [18, 33], number_lines: true}
  checks:
    - {type: patch_format, max_patches: 5}
    - {type: regex, pattern: 'out\s+pins\s*,\s*2\b', name: out2}
    - {type: regex, pattern: 'set_out_pins\s*\(\s*&c\s*,\s*data_pin\s*,\s*2\s*\)', name: out_pins_count2}
    - {type: regex, pattern: 'pio_gpio_init\s*\(\s*\w+\s*,\s*\(?\s*data_pin\s*\+\s*1', name: second_pin_init}
    - {type: regex, pattern: '1u?\s*<<\s*\(\s*data_pin\s*\+\s*1\s*\)', name: second_pin_mask}
    - {type: not_regex, pattern: '\.side_set\s+[2-5]', name: sideset_unchanged}
    - {type: table_cell, key: '^\W*2\b', col: 1, regex: 'OK', name: threshold_ok}
    - {type: choice, option: "每次送幾 bit", field_in_answer: "類型"}
  golden: |
    類型（照抄字母和文字）：C 每次送幾 bit / 用幾支腳變了 → .pio 的 `out pins, n`；set_out_pins 的 count；mask 和 pio_gpio_init 加新腳（data_pin + 1）
    shift_out.pio:11
    修改前：    out pins, 1   side 0 [1]   ; OSR 拿 1 bit 到 DATA，CLK=0，再多等 1 cycle
    修改後：    out pins, 2   side 0 [1]   ; OSR 拿 2 bit 到 DATA、DATA+1，CLK=0，再多等 1 cycle
    shift_out.pio:21
    修改前：    sm_config_set_out_pins(&c, data_pin, 1);        // out pins 的起點、幾支
    修改後：    sm_config_set_out_pins(&c, data_pin, 2);        // out pins 的起點、幾支
    shift_out.pio:26
    修改前：    uint32_t mask = (1u << data_pin) | (1u << clk_pin);
    修改後：    uint32_t mask = (1u << data_pin) | (1u << (data_pin + 1)) | (1u << clk_pin);
    shift_out.pio:29
    修改前：    pio_gpio_init(pio, data_pin);
    修改後：    pio_gpio_init(pio, data_pin);  pio_gpio_init(pio, data_pin + 1);
    | 檢查 | OK / 有問題 | 依據 |
    | 1 非 opt side_set 每行有 side；delay ≤ 上限 | OK | .side_set 1 上限 15，用 [1]，沒改 |
    | 2 out 每次 bit 數 × 次數 = 門檻 | OK | 2 bit × 16 次 = 32 |
    | 3 shift 方向和資料放的位置一致 | OK | 左移、門檻 32，整個 word 都用 |
    | 4 新用到的腳有 set_*_pins、pio_gpio_init、pindirs | OK | out_pins count 2、mask、pio_gpio_init 都加了 data_pin + 1 |
    驗證：建置沒有 pioasm 錯誤，再跑 app 的測試

