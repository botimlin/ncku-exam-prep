    - {type: regex, pattern: '__init__\(\s*["'']scaler["'']|名[稱称][^\n]*\n?[^\n]*\bscaler\b', name: node_name}
    - {type: not_regex, pattern: 'create_publisher\s*\([^\n)]*(qos_profile_sensor_data|BEST_EFFORT)', name: pub_stays_reliable}
    - {type: regex, pattern: 'import[^\n]*qos_profile_sensor_data|ReliabilityPolicy\.BEST_EFFORT', name: sensor_qos_defined}
    - {type: table_cell, key: '^\W*59\b', col: 2, regex: 'Float32\s*\(\s*\)', name: out_msg_float32}
  golden: |
    | topic | 方向 pub/sub | 型別 | QoS |
    | /imu/temp | sub | std_msgs/msg/Float32 | BEST_EFFORT、depth 5（配合 sensor_data publisher） |
    | /imu/temp_scaled | pub | std_msgs/msg/Float32 | RELIABLE、depth 10 |
    node 名稱：scaler
    | 行 | 原本 | 改成（不用改寫「不改」） |
    | 17 | from rclpy.qos import …, ReliabilityPolicy | from rclpy.qos import DurabilityPolicy, HistoryPolicy, QoSProfile, ReliabilityPolicy, qos_profile_sensor_data |
    | 18 | from std_msgs.msg import Int32 | from std_msgs.msg import Float32, Int32 |
    | 33 | super().__init__("processor") | super().__init__("scaler") |
    | 36 | declare_parameter("in_topic", "/number") | self.declare_parameter("in_topic", "/imu/temp") |
    | 37 | declare_parameter("out_topic", "/double") | self.declare_parameter("out_topic", "/imu/temp_scaled") |
    | 38 | declare_parameter("factor", 2) | self.declare_parameter("gain", 0.5) |
    | 42 | get_parameter("factor") | self.factor = self.get_parameter("gain").value |
    | 45 | create_publisher(Int32, out_topic, QOS) | self.pub = self.create_publisher(Float32, out_topic, QOS) |
    | 46 | create_subscription(Int32, in_topic, self.on_msg, QOS) | self.sub = self.create_subscription(Float32, in_topic, self.on_msg, qos_profile_sensor_data) |
    | 59 | out = Int32() | out = Float32() |
