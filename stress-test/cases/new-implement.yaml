- id: impl-asm-count
  tags: [impl, riscv, asm, reference]
  desc: bge a2,t1 → 跳過的是 limit >= arr[i]，所以計數 arr[i] > limit；迴圈 n 次
  turns:
    - card: {file: "riscv-hazard3.md", title: "RISC-V Hazard3 2/8"}
      assistant: "收到"
  card: {file: "12-implement.md", title: "實作 7/9"}
  fills:
    - match: "組語"
      value:
        number_lines: 1
        text: |2-
              .globl count_above
          count_above:
              li   t0, 0
              beqz a1, 3f
          1:  lw   t1, 0(a0)
              bge  a2, t1, 2f
              addi t0, t0, 1
          2:  addi a0, a0, 4
              addi a1, a1, -1
              bnez a1, 1b
          3:  mv   a0, t0
              ret
    - {match: "參數意思", value: "a0 = const int32_t *arr，a1 = uint32_t n，a2 = int32_t limit；回傳 a0"}
  checks:
    - {type: table_cell, key: '^\W*6\b', col: 2, regex: 'a2\)?\s*>=\s*(\(\w+\)\s*)?t1|t1\)?\s*<=\s*(\(\w+\)\s*)?a2', name: bge_operand_order}
    - {type: regex, pattern: '等價的 C[\s\S]*(>\s*limit|limit\s*<|>\s*a2\b|a2\s*<\s*)', name: counts_greater}
    - {type: answer_field, field: "迴圈跑幾次", regex: '\bn\b|a1', name: loop_n}
    - {type: table_rows, min: 10}
  golden: |
    | 行 | 指令 | 運算（C 寫法） | 結果寫到 |
    | 3 | li t0, 0 | t0 = 0 | t0 |
    | 4 | beqz a1, 3f | if (a1 == 0) goto 3 | 跳到 label 3 |
    | 5 | lw t1, 0(a0) | t1 = *(int32_t *)(a0 + 0) | t1 |
    | 6 | bge a2, t1, 2f | if ((int32_t)a2 >= (int32_t)t1) goto 2 | 跳到 label 2 |
    | 7 | addi t0, t0, 1 | t0 = t0 + 1 | t0 |
    | 8 | addi a0, a0, 4 | a0 = a0 + 4（下一個 int32） | a0 |
    | 9 | addi a1, a1, -1 | a1 = a1 - 1 | a1 |
    | 10 | bnez a1, 1b | if (a1 != 0) goto 1 | 跳到 label 1 |
    | 11 | mv a0, t0 | a0 = t0 | a0 |
    | 12 | ret | return | pc = ra |
    等價的 C（≤ 6 行）：
    ```c
    uint32_t count_above(const int32_t *arr, uint32_t n, int32_t limit) {
        uint32_t c = 0;
        for (uint32_t i = 0; i < n; i++) if (arr[i] > limit) c++;
        return c;
    }
    ```
    迴圈跑幾次：n 次（a1 = 0 時直接跳到 3，跑 0 次）
    可疑處：無（bge 是有號比較，和 int32_t 相符）

