- id: starter2-shortcut
  tags: [starter, format]
  desc: 開場 2/3 後用 /除錯 → 表格最多 3 列、先不修
  turns:
    - card: {file: "00-starter.md", title: "開場｜2/3"}
      assistant: "了解"
  card: null
  user: |
    /除錯
    <<<資料 開始>>>
    症狀：Pico 的 dst 只有 dst[0] 有值，其他都是 0。
    程式：
    54	channel_config_set_transfer_data_size(&c, DMA_SIZE_32);
    55	dma_channel_configure(ch, &c, dst, src, dma_encode_transfer_count(1024), true);
    <<<資料 結束>>>
  checks:
    - {type: table_rows, min: 2, max: 5}
    - {type: contains_any, items: ["write_increment", "寫入位址", "寫遞增", "dst 沒有遞增", "遞增"], name: finds_cause}
    - {type: not_regex, pattern: "修改後", name: no_fix_yet, category: format}
  golden: |
    | 原因 | 可能性 | 驗證方法 |
    | 沒設 channel_config_set_write_increment(&c, true)，預設 false，每次都寫到 dst[0] | 高 | 加那一行再跑，看 dst 是否全對 |

