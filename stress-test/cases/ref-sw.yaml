- id: ref-ros2-cli-private-name
  tags: [ref, sw, ros2]
  desc: 名稱解析：~/number 在 ns /ns、node n → /ns/n/number
  turns:
    - card: {file: "ros2.md", title: "ROS 2 8/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "node 名稱 n、namespace /ns，程式裡 topic 寫 ~/number，實際的 topic 全名是什麼？寫 number 呢？"}
  checks:
    - {type: contains_all, items: ["/ns/n/number", "/ns/number"], name: resolved}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "~/number[^\\n]*→\\s*/number\\b|答案[^\\n]*~/number[^\\n]*/n/number(?<!/ns/n/number)", name: no_wrong_resolve}
  golden: |
    證據：「`number` 相對 → `/ns/number`；`~/number` 私有 → `/ns/n/number`。」
    答案：~/number 是 /ns/n/number；number 是 /ns/number。
    注意事項：區分大小寫，差一字就是另一個 topic
    不確定的地方：無

