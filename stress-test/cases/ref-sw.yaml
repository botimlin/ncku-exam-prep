- id: ref-dsp-ema-bias
  tags: [ref, sw, dsp]
  desc: y += (x - y) >> k 收斂卡在 985（不對稱）→ acc 帶 k 位額外小數
  turns:
    - card: {file: "control-dsp.md", title: "控制DSP 4/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我的 EMA 寫 y += (x - y) >> 4;，輸入固定 1000 時輸出停在 985 上不去。為什麼？怎麼改？"}
  checks:
    - {type: contains_any, items: ["acc"], name: acc_fix}
    - {type: contains_any, items: ["截斷", "不對稱", "額外小數"], name: reason}
