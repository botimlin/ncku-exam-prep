  fills:
    - match: "我的程式"
      value: |2
            12	static inline int32_t gain_q16(int32_t x, int32_t g) {
            13	    int64_t p = (int64_t)(x * g);
            14	    return (int32_t)((p + (1 << 15)) >> 16);
            15	}
            16	static inline int16_t clip(int32_t v) {
            17	    return v > 32767 ? 32767 : (v < -32768 ? -32768 : (int16_t)v);
            18	}
  checks:
    - {type: regex, pattern: "違反[^\\n]*\\(int64_t\\)\\s*\\(\\s*x\\s*\\*\\s*g\\s*\\)|\\(int64_t\\)\\s*\\(\\s*x\\s*\\*\\s*g\\s*\\)[^\\n]*違反", name: cast_flagged}
    - {type: not_regex, pattern: "違反[^\\n]*32767\\s*\\?|32767\\s*\\?[^\\n]*違反", name: clip_ok}
    - {type: not_regex, pattern: "(違反[\\s\\S]*){4,}", name: few_false_alarms}
  golden: |
    參考卡上的規則：
    1. 先放大到 64 位元再移位。
    2. 最常見錯誤：(int64_t)(a * b) 括號錯，a*b 先以 32 位元溢位（UB）。正確是 (int64_t)a * b。
