- id: ref-cperf-fp-contract
  tags: [ref, sw, c-perf]
  desc: 避免 a*b+c 被合成 FMA → -ffp-contract=off（GNU 模式預設 fast）
  turns:
    - card: {file: "c-linux-perf.md", title: "C/Linux 效能 5/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "同一個 C 程式在 aarch64 和 x86-64 上 -O2 編譯，浮點輸出末位不同。可能是什麼？要加什麼旗標？"}
  checks:
    - {type: contains_any, items: ["-ffp-contract=off"], name: flag}
    - {type: contains_any, items: ["FMA"], name: fma}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "加\\s*`?-ffast-math|加\\s*`?-Ofast", name: no_fast_math}
  golden: |
    證據：「GNU 模式（預設 -std=gnu17）預設 -ffp-contract=fast：有 FMA 時（aarch64 一律有；x86 需 -mfma / x86-64-v3 / native）a*b+c 可能合成 FMA，末位不同 → 加 -ffp-contract=off。」
    答案：aarch64 把 a*b+c 合成 FMA；加 -ffp-contract=off。
    注意事項：-ffast-math / -Ofast 會改浮點結果
    不確定的地方：無

