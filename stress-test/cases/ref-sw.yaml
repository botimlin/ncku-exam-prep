  checks:
    - {type: contains_any, items: ["4.71"], name: s8}
    - {type: regex, pattern: "10\\s*倍|→\\s*10\\b|=\\s*10\\b", name: s_inf}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "答案[^\\n]*\\b8\\s*倍", name: not_linear}
  golden: |
    證據：「Amdahl S = 1/((1−p)+p/N)：p=0.9 時 N=4 → 3.08、N=8 → 4.71、N=∞ → 10」
    答案：S = 1/(0.1 + 0.9/8) ≈ 4.71 倍；無限核心也只有 10 倍。
    注意事項：基準 T1 用最佳 serial 版
    不確定的地方：無

