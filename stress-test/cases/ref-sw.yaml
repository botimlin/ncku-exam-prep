  golden: |
    證據：「錯誤寫法：y += (x - y) >> k; 實測 k=4 從 0 往 1000 收斂卡在 985，往負方向卻到 -1000（不對稱偏差）。」「狀態 acc 帶 k 位額外小數（acc = y·2^k），避免截斷造成穩態誤差」
