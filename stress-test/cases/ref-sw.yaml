      value: |2
            30	void uart_rx_isr(void) {
            31	    BaseType_t woken = pdFALSE;
            32	    while (uart_is_readable(uart0)) {
            33	        uint8_t c = uart_getc(uart0);
            34	        xQueueSend(rx_q, &c, 0);
            35	    }
            36	    portYIELD_FROM_ISR(woken);
            37	}
  checks:
    - {type: regex, pattern: "違反[^\\n]*xQueueSend\\(|xQueueSend\\([^\\n]*違反", name: send_flagged}
