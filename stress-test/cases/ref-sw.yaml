- id: ref-algo-modulo-index
  tags: [ref, sw, algo]
  desc: i = (i+1) % N → N 取 2^k 用 & (N-1)，或 if (++i == N) i = 0;
  turns:
    - card: {file: "algorithms-ds.md", title: "演算法 1/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "熱迴圈裡有 idx = (idx + 1) % N，怎麼改比較快？N 不是 2 的冪時呢？"}
  checks:
    - {type: regex, pattern: "&\\s*\\(\\s*N\\s*-\\s*1\\s*\\)", name: mask}
    - {type: regex, pattern: "\\+\\+\\s*(i|idx)\\s*==\\s*N", name: compare_reset}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "&\\s*N\\b(?!\\s*-)", name: no_mask_n}
  golden: |
    證據：「`i = (i+1) % N` | N 取 2^k 用 `& (N-1)`，或 `if (++i == N) i = 0;` | 加 _Static_assert」
    答案：N 是 2 的冪時 idx = (idx + 1) & (N-1)；不是時寫 if (++idx == N) idx = 0;。
    注意事項：用 & 時加 _Static_assert 確認 N 是 2 的冪
    不確定的地方：無

