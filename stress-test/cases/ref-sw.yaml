- id: ref-cperf-check-setvbuf-late
  tags: [ref, sw, c-perf, check-code]
  desc: 查詢 2/2：setvbuf 放在 printf 之後 → 違反「必須在第一次輸出前呼叫」
  turns:
    - card: {file: "c-linux-perf.md", title: "C/Linux 效能 8/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 2/2"}
  fills:
    - match: "我的程式"
      value: |2
            30	static char outbuf[1 << 20];
            31	int main(void) {
            32	    int n = read_n();
            33	    printf("%d\n", n);
            34	    setvbuf(stdout, outbuf, _IOFBF, sizeof outbuf);
            35	    for (int i = 0; i < n; i++) write_int(calc(i));
            36	    flush_out();
            37	    return 0;
            38	}
  checks:
    - {type: regex, pattern: "違反[^\\n]*setvbuf|setvbuf[^\\n]*違反", name: setvbuf_flagged}
    - {type: not_regex, pattern: "違反[^\\n]*flush_out|flush_out[^\\n]*違反", name: flush_ok}
    - {type: not_regex, pattern: "(違反[\\s\\S]*){4,}", name: few_false_alarms}
  golden: |
    參考卡上的規則：
    1. main 結束前一定要 flush_out()！忘記 = 輸出不完整
    2. 加大緩衝：setvbuf(stdout, outbuf, _IOFBF, sizeof outbuf); 必須在第一次輸出前呼叫。
    3. 互動題必須每次輸出後 fflush(stdout)，否則卡住。
    | # | 結果 OK / 違反 / 看不到 | 程式那一行（帶行號） |
    |---|---|---|
    | 1 | OK | 36 flush_out(); |
    | 2 | 違反 | 34 setvbuf(stdout, outbuf, _IOFBF, sizeof outbuf); 在 33 printf 之後 |
    | 3 | 看不到 | — |
    最該先修的 1 條：把第 34 行移到第 32 行之前

