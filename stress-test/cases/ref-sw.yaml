# 參考卡（軟體）：先貼一張參考卡、模型回「收到」，再用 11-ask-reference.md 的查詢 1/2（回答）或 2/2（檢查程式）。
# 每張參考卡至少 1 題「只有這張卡答得出來」；每份檔案 ≥ 2 題「卡上沒有」（要回「資料中沒有」）與 1 題 check-code。
# 卡片內容已對照 Jazzy docker image、GCC 13.3、Python 3.12.3、官方原始碼查證（2026-11-12）。

# ============================================================ ROS 2（ros2.md）

- id: ref-ros2-ladder-docker-exec
  tags: [ref, sw, ros2]
  desc: 除錯階梯 0：非互動 docker exec 不讀 .bashrc → bash -c 'source … && ros2 …'
  turns:
    - card: {file: "ros2.md", title: "ROS 2 1/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我用 docker exec rosbox ros2 topic list 會出現 ros2: command not found，但 docker exec -it rosbox bash 進去再打就可以。為什麼？不進去的話指令要怎麼寫？"}
  checks:
    - {type: contains_any, items: ["source /opt/ros/jazzy/setup.bash", "bash -c"], name: source_cmd}
    - {type: contains_any, items: [".bashrc", "非互動"], name: reason_bashrc}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "apt(-get)?\\s+install|重新安裝|重裝", name: no_reinstall}
  golden: |
    證據：「非互動 `docker exec <c> ros2 ...` 不讀 .bashrc」
    答案：非互動的 docker exec 不讀 .bashrc，所以沒有 ROS 環境；改用 docker exec rosbox bash -c 'source /opt/ros/jazzy/setup.bash && ros2 topic list'。
    注意事項：先 printenv | grep -i ROS 確認有 ROS_DISTRO=jazzy
    不確定的地方：無

- id: ref-ros2-symptom-first-lost
  tags: [ref, sw, ros2]
  desc: 症狀表：第一筆總是不見 → VOLATILE 下 publish 太早、discovery 未完成（不是 BEST_EFFORT）
  turns:
    - card: {file: "ros2.md", title: "ROS 2 2/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我的 subscriber 每次都少收第一筆（有時前兩筆），之後都正常。最優先懷疑什麼？"}
    - {match: "我的情境", value: "publisher 一啟動就馬上 publish，QoS 用 10"}
  checks:
    - {type: field_matches, field: "答案", regex: "discovery|太早|VOLATILE", name: first_lost_discovery}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "答案[^\\n]*(是|因為|懷疑)\\s*BEST_EFFORT", name: not_best_effort}
  golden: |
    證據：「第一筆或前幾筆總是不見 → VOLATILE 下 publish 太早，discovery 未完成。」
    答案：VOLATILE 下 publisher 太早 publish，discovery 還沒完成，前幾筆沒人收。
    注意事項：偶爾少幾筆才是 BEST_EFFORT / depth 太小
    不確定的地方：無

- id: ref-ros2-symptom-type-mismatch
  tags: [ref, sw, ros2]
  desc: 型別不同（Int32 vs Int64）通常沒有 WARN；用 ros2 topic list -t 看（查證後修正的事實）
  turns:
    - card: {file: "ros2.md", title: "ROS 2 2/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "publisher 用 std_msgs/msg/Int32、subscriber 用 std_msgs/msg/Int64，同一個 topic /y。log 會出現什麼警告？要怎麼確認是型別不同？"}
  checks:
    - {type: contains_any, items: ["topic list -t", "list -t"], name: list_t}
    - {type: regex, pattern: "無\\s*WARN|沒有[^\\n]{0,8}(WARN|警告)|不會[^\\n]{0,6}(WARN|警告)", name: no_warn}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "Incompatible type on topic|incompatible QoS", name: no_invented_warn}
  golden: |
    證據：「型別不同（Int32 vs Int64）→ 連不上、通常無 WARN；`ros2 topic list -t` 同一 topic 列出兩種型別。」
    答案：通常沒有任何 WARN，只是連不上；用 ros2 topic list -t，/y 會同時列出 Int32 和 Int64 兩種型別。
    注意事項：無
    不確定的地方：無

- id: ref-ros2-qos-sensor-vs-default
  tags: [ref, sw, ros2]
  desc: QoS 相容：pub BEST_EFFORT（sensor_data）+ sub RELIABLE（qos=10）→ 不相容、收不到
  turns:
    - card: {file: "ros2.md", title: "ROS 2 3/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "publisher 用 qos_profile_sensor_data，我的 node 用 create_subscription(Int32, '/x', cb, 10)。我的 node 收得到嗎？"}
  checks:
    - {type: field_matches, field: "答案", regex: "不相容|收不到|不會收到|收不到|不能|無法|不會", name: incompatible}
    - {type: contains_any, items: ["BEST_EFFORT"], name: names_policy}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "答案[^\\n]*(?<!不)(收得到|可以收到|能收到)", name: not_compatible}
  golden: |
    證據：「Reliability：pub BEST_EFFORT + sub RELIABLE → 不相容；其他相容。」「sensor_data：KEEP_LAST、depth 5、BEST_EFFORT、VOLATILE。」
    答案：收不到。10 是 RELIABLE，sensor_data 的 publisher 是 BEST_EFFORT，這對不相容，完全不傳。
    注意事項：不相容是靜默失敗，只有 WARN「requesting incompatible QoS」；用 ros2 topic info -v /x 比對
    不確定的地方：無

- id: ref-ros2-rclpy-arg-order
  tags: [ref, sw, ros2]
  desc: rclpy create_subscription (type, topic, callback, qos)；qos=10 = KEEP_LAST 10、RELIABLE、VOLATILE
  turns:
    - card: {file: "ros2.md", title: "ROS 2 4/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "rclpy 的 create_subscription 參數順序是什麼？最後那個 10 代表什麼 QoS？"}
  checks:
    - {type: regex, pattern: "type[^\\n]*topic[^\\n]*callback[^\\n]*qos", name: order_rclpy}
    - {type: contains_all, items: ["KEEP_LAST", "RELIABLE"], name: qos10}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "答案[^\\n]*(BEST_EFFORT|\\(\\s*type\\s*,\\s*topic\\s*,\\s*qos)", name: no_wrong_order}
  golden: |
    證據：「subscription (type, topic, callback, qos)。qos=10 即 KEEP_LAST 10、RELIABLE、VOLATILE。」
    答案：順序是 (type, topic, callback, qos)；10 = KEEP_LAST depth 10、RELIABLE、VOLATILE。
    注意事項：沒 spin 則 callback 不跑
    不確定的地方：無

- id: ref-ros2-jazzy-int32-overflow
  tags: [ref, sw, ros2]
  desc: rclpy Int32 給超範圍值不丟例外、靜默回繞（實測 2**31+5 → -2147483643）
  turns:
    - card: {file: "ros2.md", title: "ROS 2 5/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我把 msg.data = 2**31 + 5 指定給 std_msgs/msg/Int32 再 publish，會丟例外嗎？對方收到的值是多少？"}
    - {match: "我的情境", value: "沒有設 ROS_PYTHON_CHECK_FIELDS"}
  checks:
    - {type: contains_any, items: ["-2147483643"], name: wrapped_value}
    - {type: regex, pattern: "不(會)?丟|不檢查|靜默", name: no_exception}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "答案[^\\n]*((?<!不)會丟|OverflowError|丟出例外)", name: no_overflow_error}
  golden: |
    證據：「rclpy 訊息欄位預設不檢查範圍（Iron 起關閉）。」「實測 2**31+5 → -2147483643」
    答案：不會丟例外，在 C 層取低 32 位回繞，對方收到 -2147483643。
    注意事項：設 ROS_PYTHON_CHECK_FIELDS=1 才會 assert；回繞公式 ((v + 2**31) & 0xFFFFFFFF) - 2**31
    不確定的地方：無

