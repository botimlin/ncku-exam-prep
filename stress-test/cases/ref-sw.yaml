    |---|---|---|
    | 1 | 違反 | 34 xQueueSend(rx_q, &c, 0); |
    | 2 | OK | 31 BaseType_t woken = pdFALSE; |
    | 3 | OK | 36 portYIELD_FROM_ISR(woken); |
    最該先修的 1 條：第 34 行改成 xQueueSendFromISR(rx_q, &c, &woken);

