  desc: Amdahl p=0.9、N=8 → 4.71；N=∞ → 10
  turns:
    - card: {file: "parallel-distributed.md", title: "平行 1/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
