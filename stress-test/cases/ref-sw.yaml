- id: ref-pyperf-process-time
  tags: [ref, sw, py-perf]
  desc: CPU 時間用 time.process_time()；牆鐘 perf_counter_ns；不要 time.time()
  turns:
    - card: {file: "python-perf.md", title: "Python 效能 1/7"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我想知道一段程式是真的在算，還是在等 I/O。要量哪兩種時間、用哪兩個函式？"}
  checks:
    - {type: contains_all, items: ["process_time", "perf_counter"], name: both_clocks}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
