- id: ref-ros2-check-sleep-in-callback
  tags: [ref, sw, ros2, check-code]
  desc: 查詢 2/2：callback 內 time.sleep → 違反「callback 不可 time.sleep()」，其他不亂報
  turns:
    - card: {file: "ros2.md", title: "ROS 2 6/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 2/2"}
  fills:
    - match: "我的程式"
      value: |2
            12	        self.create_timer(0.01, self.fast_loop, callback_group=g_timer)
            13	        self.create_subscription(Int32, '/number', self.on_msg, 10, callback_group=g_sub)
            14	    def on_msg(self, msg):
            15	        with self.lock:
            16	            self.last = msg.data
            17	        time.sleep(0.5)
            18	    def fast_loop(self):
            19	        with self.lock:
            20	            v = self.last
  checks:
    - {type: regex, pattern: "違反[^\\n]*time\\.sleep|time\\.sleep[^\\n]*違反", name: sleep_flagged}
    - {type: not_regex, pattern: "(違反[\\s\\S]*){4,}", name: few_false_alarms}
  golden: |
    參考卡上的規則：
    1. MutuallyExclusive：同組一次一個。Reentrant：同組（含同一 callback 自己）可並行。
    2. 只有 MultiThreadedExecutor + 不同 group（或 Reentrant）才真的並行 → 共享資料加鎖
    3. callback 不可 `time.sleep()` / `while True`；固定頻率用 timer。
    | # | 結果 OK / 違反 / 看不到 | 程式那一行（帶行號） |
    |---|---|---|
    | 1 | OK | 12 / 13 各自不同 group |
    | 2 | OK | 15 with self.lock: |
    | 3 | 違反 | 17 time.sleep(0.5) |
    最該先修的 1 條：第 17 行 time.sleep 拿掉，改用 timer

