  golden: |
    證據：「`time.perf_counter_ns()` 牆鐘；`time.process_time()` CPU 時間。牆鐘 ≫ CPU → 在等 I/O / 鎖 / sleep。不要用 `time.time()`。」
    答案：牆鐘用 time.perf_counter_ns()、CPU 時間用 time.process_time()；牆鐘遠大於 CPU 時間就是在等 I/O / 鎖 / sleep。
    注意事項：不要用 time.time()；量測輸出寫 sys.stderr
    不確定的地方：無

