- id: ref-ros2-executor-default-group
  tags: [ref, sw, ros2]
  desc: 只換 MultiThreadedExecutor、callback 都在預設 group → 仍一次一個
  turns:
    - card: {file: "ros2.md", title: "ROS 2 6/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我把 rclpy.spin(node) 換成 MultiThreadedExecutor，timer 和 subscription 都沒指定 callback_group。它們會同時執行嗎？"}
  checks:
    - {type: field_matches, field: "答案", regex: "不會|一次一個|不能", name: not_parallel}
    - {type: contains_any, items: ["MutuallyExclusive"], name: default_group}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "答案[：:]\\s*(會|可以)", name: no_yes}
  golden: |
    證據：「node 預設 group = MutuallyExclusive。」「只有 MultiThreadedExecutor + 不同 group（或 Reentrant）才真的並行」
    答案：不會，兩個都在預設的 MutuallyExclusive group，仍一次一個；要放不同 group 才並行。
    注意事項：rclpy 有 GIL，純運算不加速；共享資料要加鎖
    不確定的地方：無

- id: ref-ros2-perf-intra-process
  tags: [ref, sw, ros2]
  desc: 同 process 零複製 intra-process 只有 rclcpp
  turns:
    - card: {file: "ros2.md", title: "ROS 2 7/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "我的 pipeline 是 rclpy 寫的兩個 node，可以開 intra-process 零複製來降低延遲嗎？"}
  checks:
    - {type: regex, pattern: "只有\\s*rclcpp|rclpy[^\\n]{0,8}(不能|不支援|沒有|無法)|不行|不可以", name: rclcpp_only}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "rclpy\\s*(也)?(可以|能)(用|開|使用)", name: no_rclpy_ipc}
  golden: |
    證據：「同 process 零複製（只有 rclcpp）：`rclcpp::NodeOptions().use_intra_process_comms(true)`」
    答案：不行，intra-process 零複製只有 rclcpp；rclpy 要改成 rclcpp 才能用。
    注意事項：熱路徑改 rclcpp 通常提升最大
    不確定的地方：無

- id: ref-ros2-cli-rclcpp-order
  tags: [ref, sw, ros2]
  desc: rclcpp create_subscription 是 (topic, qos, callback)，和 rclpy 不同
  turns:
    - card: {file: "ros2.md", title: "ROS 2 8/8"}
      assistant: "收到"
  card: {file: "11-ask-reference.md", title: "查詢 1/2"}
  fills:
    - {match: "問題", value: "rclcpp 的 create_subscription 參數順序是什麼？"}
  checks:
    - {type: regex, pattern: "topic\\s*,\\s*qos\\s*,\\s*(callback|cb)", name: order_rclcpp}
    - {type: evidence_grounded, min_quotes: 1, max_bad: 1}
    - {type: not_regex, pattern: "答案[^\\n]*topic\\s*,\\s*(callback|cb)\\s*,\\s*qos", name: not_rclpy_order}
  golden: |
    證據：「C++ subscription 參數是 (topic, qos, callback)，與 rclpy 不同。」
