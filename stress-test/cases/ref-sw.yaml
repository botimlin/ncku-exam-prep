  tags: [ref, sw, dsp, check-code]
  desc: 查詢 2/2：(int64_t)(a * b) → 違反「最常見錯誤：括號錯，a*b 先以 32 位元溢位」
  turns:
    - card: {file: "control-dsp.md", title: "控制DSP 2/8"}
      assistant: "收到"
