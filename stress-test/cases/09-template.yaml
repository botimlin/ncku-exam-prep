- id: tpl7-review-count
  tags: [template, review, hard]
  desc: 4096 bytes 用 DMA_SIZE_32 卻傳 4096 → 第 2 項有問題
  card: {file: "09-template-adapt.md", title: "範本 7/7"}
  fills:
    - value: |
        diff --git a/pico/app_dma.c b/pico/app_dma.c
        @@ -10,0 +10,9 @@
        +static uint8_t rx_buf[4096] __attribute__((aligned(4)));   // 4096 bytes
        +static uint8_t tx_buf[4096] __attribute__((aligned(4)));
        +static void copy_rx_to_tx(void) {
        +    int ch = dma_claim_unused_channel(true);
        +    dma_channel_config c = dma_channel_get_default_config((uint)ch);
        +    channel_config_set_transfer_data_size(&c, DMA_SIZE_32);
        +    channel_config_set_write_increment(&c, true);
        +    dma_channel_configure((uint)ch, &c, tx_buf, rx_buf, dma_encode_transfer_count(4096), true);
        +    dma_channel_wait_for_finish_blocking((uint)ch);
        +    dma_channel_unclaim((uint)ch);
        +}
  checks:
    - {type: table_cell, key: "^2\\b", col: 1, regex: "有問題"}
    - {type: regex, pattern: "1024", name: gives_1024}
  golden: |
    | # | 結果 | 證據（diff 那一行） |
    | 1 | 看不到 | |
    | 2 | 有問題 | 「dma_encode_transfer_count(4096)」用 DMA_SIZE_32，4096 bytes 應該是 1024 次 |
    | 3 | OK | 「channel_config_set_write_increment(&c, true);」「dma_channel_unclaim((uint)ch);」 |
    | 4 | 看不到 | |
    | 5 | OK | 「static uint8_t rx_buf[4096]」 |
    | 6 | 看不到 | |
    | 7 | 看不到 | |
    | 8 | 看不到 | |
    | 9 | 看不到 | |
    最嚴重的 1 個問題與修法（≤ 2 行）：第 2 項，count 改成 dma_encode_transfer_count(4096 / 4)

