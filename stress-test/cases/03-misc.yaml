    這段佔總時間比例 p：0.78（上限約 4.5 倍）
    還缺的量測點（選 F 時必填）：無

- id: opt3-batch
  tags: [optimize, patch]
  desc: 實作批次：用 frame.py 的 pack_u32 + transact(CMD_SUM_U32)；最小修改
  card: {file: "03-optimize.md", title: "優化 3/6"}
  fills:
    - {match: "方案描述", value: "把逐筆送文字改成：用 frame.py 的 pack_u32 打包，每包最多 1024 個數字，用 transact(ser, CMD_SUM_U32, payload) 送出，回覆用 unpack_u32 取總和再加總"}
    - match: "要改的程式碼"
      value: |2
            30	def total_of(ser, data):
            31	    total = 0
            32	    for v in data:
            33	        ser.write(f"{v}\n".encode())
            34	        total = int(ser.readline())
            35	    return total
    - {match: "不能改", value: "函式名稱 total_of 與回傳值"}
  checks:
    - {type: patch_format, max_patches: 2}
    - {type: contains_all, items: ["pack_u32", "CMD_SUM_U32"], name: uses_frame_api}
    - {type: regex, pattern: "1024", name: chunking}
    - {type: regex, pattern: "0xFFFFFFFF|& ?0xffffffff|mod", name: wraps_u32, category: correctness}
    - {type: not_contains, items: ["def sum_of", "def total(", "totalOf"], name: keeps_name}
  golden: |
    main.py:32
    修改前：    for v in data:
            ser.write(f"{v}\n".encode())
            total = int(ser.readline())
    修改後：    for i in range(0, len(data), 1024):
            reply = transact(ser, CMD_SUM_U32, pack_u32(data[i:i + 1024]))
            total = (total + unpack_u32(reply)[0]) & 0xFFFFFFFF
    可能的副作用（1 句）：總和改成 mod 2^32
    正確性驗證指令（1 行）：python3 -c "..." 比對 sum(data) & 0xFFFFFFFF
    成功的樣子：兩個數字相同

- id: read1-absent
  tags: [read, grounding, absent]
  desc: 題目沒寫時間限制與硬體時脈 → 那兩格要「資料中沒有」；數字照抄
  card: {file: "02-read-spec.md", title: "讀題 1/6"}
  fills:
    - value: |
        第二題：資料校驗
        電腦端的 checker.py 會透過 /dev/ttyACM0 送出 64 個封包，每個封包的 payload 是 4096 bytes。
        請修改 pico/app_serial.c，讓 Pico 對每個封包回傳 payload 的 CRC32（zlib 相容，u32 little-endian）。
        checker.py 比對回傳值，全部正確才進入計時；分數依 64 個封包的總處理時間排名。
        只能修改 pico/ 資料夾內的檔案，不能修改 checker.py 與封包格式。
        每 10 分鐘最多提交 1 次。
  checks:
    - {type: regex, pattern: "時間\\s*/?\\s*記憶體限制[^\\n]*資料中沒有", name: time_limit_absent}
    - {type: regex, pattern: "硬體[^\\n]*(資料中沒有|Pico)", name: hw_slot}
    - {type: contains_all, items: ["64", "4096"], name: keeps_numbers}
    - {type: regex, pattern: "提交[^\\n]*10\\s*分鐘[^\\n]*1\\s*次", name: submit_rule}
    - {type: regex, pattern: "不能改[^\\n]*checker\\.py", name: cant_change}
    - {type: card_slots, min_fraction: 0.8}
  golden: |
    - 一句話目標：Pico 對每個封包回傳 payload 的 CRC32
    - 輸入（來源、格式、範圍、大小）：checker.py 經 /dev/ttyACM0 送 64 個封包，payload 4096 bytes
    - 輸出（目的地、格式，精確到空白與換行）：CRC32（zlib 相容，u32 little-endian）
    - 正確性怎麼判：checker.py 比對回傳值，全部正確才計時
    - 效能指標與單位：64 個封包的總處理時間
    - 給分方式（門檻 / 排名 / 比例）：排名
    - 提交方式與次數限制：每 10 分鐘最多提交 1 次
    - 時間 / 記憶體限制：資料中沒有
    - 硬體（板子、核心、時脈）：Pico（/dev/ttyACM0）；核心與時脈資料中沒有
    - 不能改的檔案 / 介面：checker.py 與封包格式
    - 不能用的方法：資料中沒有
    - 可以改的地方：pico/ 資料夾內的檔案
    - baseline：資料中沒有
    - 最容易誤解的 3 點：要 zlib 相容；回傳是 little-endian；全部正確才計時

- id: learn4-dma
  tags: [learn, grounding, absent]
  desc: 逐句檢查理解：第 4 句（count 是 bytes）錯；第 3 句 API 文件沒寫 → 資料中沒有
  card: {file: "07-unknown-tech.md", title: "速學 4/6"}
  fills:
    - {match: "技術名稱", value: "transfer engine"}
    - match: "文件段落"
      value: |
        1. count 的單位是「幾筆傳輸」，不是「幾個位元組」。這是最常見的錯誤。
        2. 位址要不要遞增，是描述的一部分。「複製」和「填值」用的是同一個引擎、同樣的筆數，差別只在來源位址走不走。
        3. 每筆的大小只能是 1、2 或 4 個位元組，而且位址要對齊。
        4. 通道是有限資源，用之前要取得、用完要歸還。這個引擎只有四個。
        使用的節奏固定是四拍：描述 (configure) → 啟動 (start) → 等待 (wait / busy) → 取用結果
    - {match: "初始化", value: "claim → configure → start → wait → release"}
    - {match: "關鍵 API", value: "engine_claim、engine_configure、engine_start、engine_wait、engine_release、engine_abort"}
    - {match: "限制", value: "最多 4 個通道；每筆 1/2/4 bytes 要對齊；count 填總共幾個 bytes"}
  checks:
    - {type: table_rows, min: 4, max: 7}
    - {type: table_cell, key: "^4$", col: 1, regex: "錯"}
    - {type: regex, pattern: "(engine_abort|abort)[^\\n]*資料中沒有|資料中沒有[^\\n]*(engine_abort|abort)|^\\|\\s*3\\s*\\|\\s*資料中沒有", name: api3_absent}
    - {type: evidence_grounded}
  golden: |
    | # | 對 / 錯 / 資料中沒有 | 證據：「原文」 | 正確說法（判錯時） |
    | 1 | 對 | 「「複製」和「填值」用的是同一個引擎」 | |
    | 2 | 對 | 「描述 (configure) → 啟動 (start) → 等待 (wait / busy) → 取用結果」 | |
    | 3 | 資料中沒有 | 文件沒有列出 engine_abort 等 API 名稱 | |
    | 4 | 錯 | 「count 的單位是「幾筆傳輸」，不是「幾個位元組」」 | count 填幾筆傳輸，不是 bytes |
