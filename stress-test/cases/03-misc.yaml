# 除錯 1/6、優化 1/6 與 3/6、讀題 1/6、速學 4/6

- id: dbg1-count-bytes
  tags: [debug, dma, rank]
  desc: DMA count 填成 bytes（DMA_SIZE_32）→ 第一個原因要是 count
  card: {file: "04-debug.md", title: "除錯 1/6"}
  fills:
    - {match: "指令與目的", value: "燒錄 app_dma 後看 USB 輸出，目的是用 DMA 複製 1024 個 u32"}
    - {match: "預期", value: "dst 前 1024 個 word 等於 src，dst[1024] 之後維持 0"}
    - {match: "實際", value: "前 1024 個正確，但 dst[1024]~dst[4095] 也被寫了東西，另一個陣列 log_buf 內容被蓋掉"}
    - {match: "錯誤訊息", value: "（沒有錯誤訊息）"}
    - match: "相關程式碼"
      value: |2
            40	static uint32_t src[1024], dst[1024];
            41	static char log_buf[8192];
            ...
            55	    channel_config_set_transfer_data_size(&c, DMA_SIZE_32);
            56	    channel_config_set_write_increment(&c, true);
            57	    dma_channel_configure(ch, &c, dst, src, dma_encode_transfer_count(sizeof(src)), true);
            58	    dma_channel_wait_for_finish_blocking(ch);
    - {match: "上次能用之後改了", value: "把 count 從 1024 改成 sizeof(src)，想說比較不會寫錯"}
    - {match: "已經試過", value: "重新燒錄，一樣"}
    - {match: "環境", value: "Pico 2（RP2350）ARM；cmake --build build"}
  checks:
    - {type: rank_first, items: ["count", "sizeof", "bytes", "位元組", "4096"], name: first_cause_count}
    - {type: evidence_grounded, min_quotes: 1}
    - {type: table_rows, min: 2, max: 5}
  golden: |
    | # | 原因 | 可能性 高/中/低 | 證據 | 驗證方法 | 結果代表什麼 |
    | 1 | count 用 sizeof(src) 是 bytes（4096），DMA_SIZE_32 一次 4 bytes → 搬了 4096 次 | 高 | 「dma_encode_transfer_count(sizeof(src))」 | 印出 sizeof(src) | 4096 而非 1024 → 確認 |
    | 2 | dst 只有 1024 格，多搬的寫到後面的 log_buf | 高 | 「static uint32_t src[1024], dst[1024];」 | 看 log_buf 是否被蓋 | 被蓋 → 確認越界 |

- id: dbg1-write-incr
  tags: [debug, dma, rank]
  desc: 只有 dst[0] 變 → 第一個原因要是 write_increment
  card: {file: "04-debug.md", title: "除錯 1/6"}
  fills:
    - {match: "指令與目的", value: "用 DMA 把 src 複製到 dst（1024 個 u32）"}
    - {match: "預期", value: "dst 全部等於 src"}
    - {match: "實際", value: "dst[0] = src[1023]，dst[1]~dst[1023] 全是 0"}
    - {match: "錯誤訊息", value: "（沒有錯誤訊息）"}
    - match: "相關程式碼"
      value: |2
            52	    int ch = dma_claim_unused_channel(true);
            53	    dma_channel_config c = dma_channel_get_default_config(ch);
            54	    channel_config_set_transfer_data_size(&c, DMA_SIZE_32);
            55	    dma_channel_configure(ch, &c, dst, src, dma_encode_transfer_count(1024), true);
            56	    dma_channel_wait_for_finish_blocking(ch);
    - {match: "上次能用之後改了", value: "把設定改成用 dma_channel_get_default_config 的預設值"}
    - {match: "已經試過", value: "把 1024 改成 512，dst[0] 變成 src[511]"}
    - {match: "環境", value: "Pico 2（RP2350）ARM"}
  checks:
    - {type: rank_first, items: ["write_increment", "寫入位址", "寫遞增", "寫入遞增", "write increment", "dst 沒有遞增", "目的位址"], name: first_cause_write_incr}
    - {type: evidence_grounded, min_quotes: 1}
  golden: |
    | # | 原因 | 可能性 高/中/低 | 證據 | 驗證方法 | 結果代表什麼 |
    | 1 | 預設 write_increment 是 false，每次都寫到 dst[0] | 高 | 「dst[0] = src[1023]」 | 加 channel_config_set_write_increment(&c, true) 再跑 | dst 全對 → 確認 |

- id: opt1-text-io
  tags: [optimize, choice]
  desc: send_text 佔 690/710 ms → 類型 C、p≈0.97
  card: {file: "03-optimize.md", title: "優化 1/6"}
  fills:
    - {match: "目標", value: "降低處理 20000 筆的總時間"}
    - {match: "baseline", value: "710 ms"}
    - match: "各段耗時"
      value: |
        parse_input   12 ms
        send_text    690 ms   (20000 次 ser.write + readline)
        compute        3 ms
        print_result   5 ms
        total        710 ms
    - match: "熱點程式碼"
      value: |
        for v in data:
            ser.write(f"{v}\n".encode())
            total = int(ser.readline())
  checks:
    - {type: choice, option: "通訊等待", field_in_answer: "類型"}
    - {type: contains_any, items: ["send_text"], name: right_segment}
    - {type: regex, pattern: "0\\.9[5-8]|9[5-8]\\s*%|97", name: p_value}
    - {type: evidence_grounded, min_quotes: 1}
    - {type: not_regex, pattern: "批次|batch|改成|建議", name: no_fix_yet, category: format}
  golden: |
    瓶頸在哪一段：send_text
    類型：C
    證據：「send_text    690 ms」「total        710 ms」
    這段佔總時間比例 p：0.97（上限約 35 倍）
    還缺的量測點（選 F 時必填）：無

